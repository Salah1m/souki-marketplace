<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087443"><title>البائعون الذين أتابعهم | SOUKI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#18251e;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}header{background:#fff;border-bottom:1px solid #e3eae4}.nav{height:62px;width:min(900px,calc(100% - 26px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:900;color:#087443;text-decoration:none}.back{color:#087443;font-weight:800;text-decoration:none}main{width:min(900px,calc(100% - 24px));margin:22px auto 45px}h1{font-size:23px;margin:0 0 5px}.sub{color:#6b776f;margin:0 0 18px}.list{display:grid;gap:10px}.seller{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e3eae4;border-radius:14px;padding:13px;text-decoration:none;color:inherit}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#edf3ee}.info{flex:1;min-width:0}.name{font-weight:900}.meta{font-size:13px;color:#6b776f;margin-top:4px}.open{color:#087443;font-weight:800;font-size:13px}.state{background:#fff;border:1px dashed #ccd8ce;border-radius:14px;padding:25px;text-align:center;color:#6b776f}
</style></head><body><header><div class="nav"><a class="brand" href="./">سوقي · SOUKI</a><a class="back" href="account.html">← حسابي</a></div></header><main><h1>البائعون الذين أتابعهم</h1><p class="sub">تابع إعلانات البائعين الجدد من خلال زيارة ملفاتهم الشخصية.</p><section class="list" id="list"><div class="state">جارٍ تحميل القائمة...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://fvaffhfopoxgrofyilqx.supabase.co",KEY="sb_publishable_R5BievMMk58RUAgrz4Jz4g_SdBRIXEX",db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){$("list").innerHTML='<div class="state">يرجى تسجيل الدخول لرؤية البائعين الذين تتابعهم.</div>';return;}const {data:rows,error}=await db.from("seller_follows").select("seller_id,created_at").eq("follower_id",user.id).order("created_at",{ascending:false});if(error){$("list").innerHTML='<div class="state">تعذر تحميل قائمة المتابعة.</div>';return;}if(!rows?.length){$("list").innerHTML='<div class="state">لم تتابع أي بائع بعد. افتح إعلاناً واضغط على زر متابعة بجانب اسم البائع.</div>';return;}const ids=rows.map(x=>x.seller_id);const [{data:profiles},{data:ads}]=await Promise.all([db.from("profiles").select("id,display_name,avatar_url").in("id",ids),db.from("listings").select("seller_id,city").in("seller_id",ids).eq("status","active").order("created_at",{ascending:false})]);const map=new Map((profiles||[]).map(p=>[p.id,p]));const cityMap=new Map();(ads||[]).forEach(a=>{if(!cityMap.has(a.seller_id))cityMap.set(a.seller_id,a.city)});$("list").innerHTML=rows.map(row=>{const p=map.get(row.seller_id)||{};return '<a class="seller" href="seller.html?id='+encodeURIComponent(row.seller_id)+'"><img class="avatar" src="'+esc(p.avatar_url||"https://www.gravatar.com/avatar/?d=mp")+'" alt=""><div class="info"><div class="name">'+esc(p.display_name||"بائع على سوقي")+'</div><div class="meta">📍 '+esc(cityMap.get(row.seller_id)||"عضو في سوقي")+'</div></div><span class="open">عرض الملف ←</span></a>';}).join("");}
init().catch(e=>{$("list").innerHTML='<div class="state">حدث خطأ. أعد تحميل الصفحة.</div>';console.error(e);});
</script><script src="analytics.js?v=2"></script></body></html>
