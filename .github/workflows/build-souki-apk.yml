name: Build SOUKI Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-souki-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Capacitor
        working-directory: android-app
        run: npm install

      - name: Install app icon tooling
        working-directory: android-app
        run: npm install --no-save sharp @capacitor/assets

      - name: Prepare SOUKI launcher icon
        working-directory: android-app
        run: |
          mkdir -p assets
          node --input-type=module -e "import sharp from 'sharp'; await sharp('../icons/souki.svg').resize(1024, 1024).png().toFile('assets/icon.png');"

      - name: Generate Android project
        working-directory: android-app
        run: npx cap add android

      - name: Configure SOUKI Google sign-in deep link
        working-directory: android-app
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(manifestPath, 'utf8');
          // Add only the runtime permissions required by SOUKI chat media features.
          const permissions = [
            'android.permission.RECORD_AUDIO',
            'android.permission.MODIFY_AUDIO_SETTINGS',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION'
          ];
          const manifestStart = manifest.indexOf('<manifest');
          const manifestEnd = manifest.indexOf('>', manifestStart);
          if (manifestStart < 0 || manifestEnd < 0) throw new Error('Android manifest root not found');
          const missingPermissions = permissions
            .filter(permission => !manifest.includes(`android:name="${permission}"`))
            .map(permission => `    <uses-permission android:name="${permission}" />`)
            .join('\\n');
          if (missingPermissions) {
            manifest = manifest.slice(0, manifestEnd + 1) + '\\n' + missingPermissions + manifest.slice(manifestEnd + 1);
          }

          // Preserve the existing Google sign-in deep link.
          if (!manifest.includes('android:host="login-callback"')) {
            const filter = `
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.souki.marketplace" android:host="login-callback" />
                  </intent-filter>`;
            const activityStart = manifest.indexOf('<activity');
            const activityEnd = manifest.indexOf('>', activityStart);
            if (activityStart < 0 || activityEnd < 0) throw new Error('Main Android activity not found');
            manifest = manifest.slice(0, activityEnd + 1) + filter + manifest.slice(activityEnd + 1);
          }
          fs.writeFileSync(manifestPath, manifest);
          NODE

      - name: Generate native Android launcher icons
        working-directory: android-app
        run: npx capacitor-assets generate --android

      - name: Sync Android project
        working-directory: android-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: souki-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare branded APK filename
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk SOUKI.apk

      - name: Publish Android APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: SOUKI Android APK
          target_commitish: ${{ github.sha }}
          files: SOUKI.apk
          overwrite_files: true
          make_latest: true
          body: |
            SOUKI Android application.
            Download SOUKI.apk and install it on your Android phone.
