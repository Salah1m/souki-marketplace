<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087443"><title>مفضلتي | SOUKI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#18251e;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}header{background:#fff;border-bottom:1px solid #e4ebe5}.nav{height:66px;width:min(900px,calc(100% - 28px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:900;color:#087443;text-decoration:none}.back{color:#087443;text-decoration:none;font-weight:800}main{width:min(1000px,calc(100% - 24px));margin:24px auto 50px}h1{margin:0 0 6px;font-size:25px}.sub{color:#6b776f;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.product{background:white;border:1px solid #e2e9e3;border-radius:15px;overflow:hidden;cursor:pointer}.photo{height:180px;position:relative;background:#eaf0eb}.photo img{width:100%;height:100%;object-fit:cover}.remove{position:absolute;top:9px;inset-inline-end:9px;border:0;border-radius:50%;width:38px;height:38px;background:#fff;color:#e23d55;font-size:22px}.body{padding:12px}.body h3{font-size:15px;margin:0 0 8px;min-height:42px}.price{font-weight:900;color:#087443;font-size:18px}.meta{color:#6b776f;font-size:12px;margin-top:8px}.empty,.notice{background:#fff;border:1px dashed #cbd8ce;border-radius:14px;padding:28px;text-align:center;color:#65736a;line-height:1.8;grid-column:1/-1}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:155px}.body{padding:10px}.body h3{font-size:14px}}
</style></head><body>
<header><div class="nav"><a class="brand" href="./">سوقي · SOUKI</a><a class="back" href="./">← العودة إلى السوق</a></div></header>
<main><h1>❤️ مفضلتي</h1><p class="sub">المنتجات التي حفظتها للرجوع إليها لاحقاً</p><section class="grid" id="items"><div class="notice">جارٍ تحميل المفضلة...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://fvaffhfopoxgrofyilqx.supabase.co","sb_publishable_R5BievMMk58RUAgrz4Jz4g_SdBRIXEX"),$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){const {data:{user}}=await db.auth.getUser();if(!user){$("items").innerHTML='<div class="empty">سجّل الدخول إلى سوقي لرؤية المنتجات التي أضفتها إلى المفضلة.<br><a href="./">العودة إلى سوقي</a></div>';return}
const {data:favs,error}=await db.from("favorites").select("listing_id").eq("user_id",user.id).order("created_at",{ascending:false});if(error){$("items").innerHTML='<div class="empty">تعذر تحميل المفضلة: '+esc(error.message)+'</div>';return}
if(!favs?.length){$("items").innerHTML='<div class="empty">لم تحفظ أي منتج بعد. اضغط على ❤️ في بطاقة أي منتج لإضافته هنا.<br><a href="./">تصفح المنتجات</a></div>';return}
const ids=favs.map(x=>x.listing_id);const {data:ads,error:adError}=await db.from("listings").select("id,title,price,city,image_urls,product_condition,category,status").in("id",ids).eq("status","active");if(adError){$("items").innerHTML='<div class="empty">تعذر تحميل المنتجات: '+esc(adError.message)+'</div>';return}
const byId=new Map((ads||[]).map(a=>[a.id,a]));const ordered=ids.map(id=>byId.get(id)).filter(Boolean);if(!ordered.length){$("items").innerHTML='<div class="empty">لا توجد منتجات متاحة حالياً في مفضلتك.</div>';return}
$("items").innerHTML=ordered.map(a=>'<article class="product" data-id="'+a.id+'"><div class="photo"><img loading="lazy" src="'+esc(a.image_urls?.[0]||"https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=700")+'" alt=""><button class="remove" data-remove="'+a.id+'" aria-label="إزالة من المفضلة">♥</button></div><div class="body"><h3>'+esc(a.title)+'</h3><div class="price">'+Number(a.price).toLocaleString()+' درهم</div><div class="meta">📍 '+esc(a.city)+(a.product_condition?' · '+(a.product_condition==="new"?"جديد":"مستعمل"):"")+'</div></div></article>').join("");
$("items").querySelectorAll(".product").forEach(card=>card.onclick=e=>{if(e.target.closest("button"))return;location.href="listing.html?id="+encodeURIComponent(card.dataset.id)});
$("items").querySelectorAll("[data-remove]").forEach(btn=>btn.onclick=async e=>{e.stopPropagation();btn.disabled=true;const {error}=await db.from("favorites").delete().eq("user_id",user.id).eq("listing_id",btn.dataset.remove);if(error){alert("تعذر إزالة المنتج: "+error.message);btn.disabled=false;return}load()});
}load();
</script></body></html>
