<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087443"><title>إدارة إعلانات SOUKI الرسمية</title>
<script>(()=>{try{const v=localStorage.getItem("souki-language");if(v&&["ar","fr","en"].includes(v)){document.documentElement.lang=v;document.documentElement.dir=v==="ar"?"rtl":"ltr"}}catch(e){}})();</script><link rel="stylesheet" href="theme.css?v=4"><script src="theme.js?v=1"></script>
<style>
:root{--g:#087443;--ink:#18251e;--muted:#718078;--line:#e2e9e4;--bg:#f3f6f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Tahoma,Arial}.top{height:62px;background:linear-gradient(110deg,#075d39,#087443);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100% - 820px)/2))}.top a{color:white;text-decoration:none;font-weight:850}.wrap{max-width:820px;margin:22px auto;padding:0 13px}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:0 10px 30px #10271b0a}h1{font-size:23px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:800}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;background:#fff;color:var(--ink)}.field textarea{min-height:130px;resize:vertical;line-height:1.7}.pinrow{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0 14px}.primary{background:var(--g);color:white;border:0;border-radius:11px;padding:12px 17px;font:inherit;font-weight:850;cursor:pointer}.primary:disabled,button:disabled{opacity:.5;cursor:wait}.list{display:grid;gap:11px;margin-top:18px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.item h2{font-size:16px;margin:0 0 6px}.item p{white-space:pre-wrap;line-height:1.7;margin:0;color:#46534b}.meta{font-size:11px;color:var(--muted);margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.actions button{border:0;border-radius:9px;padding:8px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.pin{background:#fff4d2;color:#795400}.del{background:#fff0f0;color:#b42318}.notice,.empty{padding:22px;border:1px dashed var(--line);border-radius:13px;background:#f8faf8;color:var(--muted);text-align:center}.hidden{display:none!important}html[data-souki-theme="dark"] .panel,html[data-souki-theme="dark"] .item{background:#19271e;border-color:#304238;color:#edf4ef}html[data-souki-theme="dark"] .item p{color:#c1cec5}html[data-souki-theme="dark"] .field input,html[data-souki-theme="dark"] .field textarea{background:#17231b;color:#edf4ef;border-color:#304238}html[data-souki-theme="dark"] .notice,html[data-souki-theme="dark"] .empty{background:#19271e;border-color:#304238;color:#aab8af}@media(max-width:560px){.top{height:56px;padding:0 14px}.wrap{margin:12px auto;padding:0 9px}.panel{padding:15px 12px}h1{font-size:20px}}
</style></head><body><header class="top"><a href="./">سوقي · SOUKI</a><a href="admin.html">← لوحة الإدارة</a></header><main class="wrap"><section class="panel"><h1>📢 رسائل وإعلانات SOUKI الرسمية</h1><p class="sub">اكتب إعلاناً واحداً وسيظهر لجميع المستخدمين المسجلين في صندوق الرسائل.</p><div id="notice" class="notice">جارٍ التحقق من صلاحيات الإدارة...</div><div id="app" class="hidden"><form id="form"><div class="field"><label for="title">عنوان الإعلان</label><input id="title" maxlength="160" required placeholder="مثلاً: تحديث جديد في سوقي"></div><div class="field"><label for="body">نص الرسالة</label><textarea id="body" maxlength="4000" required placeholder="اكتب الرسالة التي تريد إرسالها لجميع المستخدمين..."></textarea></div><label class="pinrow"><input id="pinned" type="checkbox"> تثبيت الإعلان في أعلى القائمة</label><button class="primary" id="publish" type="submit">نشر الإعلان لجميع المستخدمين</button></form><h2 style="font-size:18px;margin:25px 0 0">الإعلانات المنشورة</h2><div id="list" class="list"><div class="empty">جارٍ تحميل الإعلانات...</div></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://fvaffhfopoxgrofyilqx.supabase.co","sb_publishable_R5BievMMk58RUAgrz4Jz4g_SdBRIXEX"),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let adminId=null;
async function start(){const {data:{user},error}=await db.auth.getUser();if(error||!user){$("notice").textContent="يجب تسجيل الدخول بحساب المدير.";return}const {data:admin,error:adminError}=await db.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();if(adminError||!admin){$("notice").textContent="ليس لديك صلاحية إدارة الإعلانات الرسمية.";return}adminId=user.id;$("notice").classList.add("hidden");$("app").classList.remove("hidden");await load()}
async function load(){const {data,error}=await db.from("announcements").select("id,title,body,is_pinned,created_at").order("created_at",{ascending:false});if(error){$("list").textContent="تعذر تحميل الإعلانات: "+error.message;return}if(!data?.length){$("list").innerHTML='<div class="empty">لم تنشر أي إعلانات بعد.</div>';return}$("list").innerHTML=data.map(n=>'<article class="item"><h2>'+(n.is_pinned?"📌 ":"📢 ")+esc(n.title)+'</h2><p>'+esc(n.body)+'</p><div class="meta">'+new Date(n.created_at).toLocaleString("ar-MA")+'</div><div class="actions"><button class="pin" data-pin="'+n.id+'" data-next="'+(!n.is_pinned)+'">'+(n.is_pinned?"إلغاء التثبيت":"تثبيت في الأعلى")+'</button><button class="del" data-del="'+n.id+'">حذف الإعلان</button></div></article>').join("");$("list").querySelectorAll("[data-pin]").forEach(b=>b.onclick=async()=>{b.disabled=true;const {error}=await db.from("announcements").update({is_pinned:b.dataset.next==="true"}).eq("id",b.dataset.pin);if(error)alert("تعذر تعديل التثبيت: "+error.message);await load()});$("list").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("هل تريد حذف هذا الإعلان من جميع المستخدمين؟"))return;b.disabled=true;const {error}=await db.from("announcements").delete().eq("id",b.dataset.del);if(error){alert("تعذر حذف الإعلان: "+error.message);b.disabled=false;return}await load()})}
$("form").onsubmit=async e=>{e.preventDefault();const title=$("title").value.trim(),body=$("body").value.trim();if(!title||!body)return;const b=$("publish");b.disabled=true;b.textContent="جارٍ النشر...";const {error}=await db.from("announcements").insert({title,body,is_pinned:$("pinned").checked,created_by:adminId});if(error){alert("تعذر نشر الإعلان: "+error.message);b.disabled=false;b.textContent="نشر الإعلان لجميع المستخدمين";return}$("form").reset();b.disabled=false;b.textContent="نشر الإعلان لجميع المستخدمين";alert("تم نشر الإعلان لجميع المستخدمين.");await load()};
start().catch(e=>$("notice").textContent="حدث خطأ: "+e.message);
</script><script src="notifications.js?v=1"></script><script src="analytics.js?v=2"></script><script src="language.js?v=4"></script><script type="module" src="native-auth.js?v=1"></script><script src="pull-to-refresh.js?v=1"></script></body></html>
