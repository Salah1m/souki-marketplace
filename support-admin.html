<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087443"><title>دعم العملاء | SOUKI</title>
<style>
:root{--g:#087443;--ink:#18251e;--muted:#718078;--line:#e2e9e4;--bg:#f3f6f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Tahoma,Arial}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.top a{color:var(--g);font-weight:850;text-decoration:none}.wrap{max-width:1100px;margin:22px auto;padding:0 14px}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}.panel h2{margin:0 0 12px;font-size:18px}.ticket{width:100%;text-align:start;background:#f7faf7;border:1px solid var(--line);border-radius:11px;padding:12px;margin:6px 0;font:inherit;cursor:pointer}.ticket.active{border-color:var(--g);background:#edf7f0}.ticket small{display:block;color:var(--muted);margin-top:5px}.messages{height:60vh;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:8px}.bubble{max-width:85%;align-self:flex-start;background:#eef3ef;border-radius:13px;padding:10px 13px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#e1f4e8}.bubble time{display:block;color:var(--muted);font-size:10px;margin-top:4px}.compose{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}.compose textarea{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:11px;padding:10px;font:inherit}.compose button{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:800}.empty{color:var(--muted);text-align:center;padding:25px}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.messages{height:45vh}}
</style><link rel="stylesheet" href="theme.css?v=3"><script src="theme.js?v=1"></script></head><body><header class="top"><a href="admin.html">← لوحة الإدارة</a><strong>🎧 دعم عملاء SOUKI</strong></header><main class="wrap"><div id="status" class="panel empty">جارٍ التحقق من صلاحيات الإدارة...</div><div id="app" class="grid hidden"><section class="panel"><h2>طلبات العملاء</h2><div id="tickets" class="empty">جارٍ التحميل...</div></section><section class="panel"><h2 id="title">اختر طلب دعم</h2><div id="messages" class="messages"><div class="empty">ستظهر المحادثة هنا.</div></div><form id="compose" class="compose hidden"><textarea id="body" maxlength="4000" placeholder="اكتب ردك للعميل..." required></textarea><button id="send">إرسال الرد</button></form></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://fvaffhfopoxgrofyilqx.supabase.co","sb_publishable_R5BievMMk58RUAgrz4Jz4g_SdBRIXEX"),$=id=>document.getElementById(id);let user=null,current=null,rows=[],channel=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function append(m){if(document.querySelector('[data-msg="'+m.id+'"]'))return;const e=document.createElement("div");e.className="bubble"+(m.sender_id===user.id?" mine":"");e.dataset.msg=m.id;e.innerHTML=esc(m.body)+'<time>'+new Date(m.created_at).toLocaleString()+'</time>';$("messages").append(e);$("messages").scrollTop=$("messages").scrollHeight}
async function loadTickets(){const {data,error}=await db.from("support_tickets").select("id,user_id,subject,status,last_message_at").order("last_message_at",{ascending:false});if(error)throw error;rows=data||[];const ids=[...new Set(rows.map(x=>x.user_id))];let profiles=[];if(ids.length){const r=await db.from("profiles").select("id,display_name").in("id",ids);profiles=r.data||[]}const names=new Map(profiles.map(p=>[p.id,p.display_name]));$("tickets").innerHTML=rows.length?rows.map(t=>'<button class="ticket '+(current?.id===t.id?"active":"")+'" data-id="'+t.id+'"><b>'+esc(t.subject)+'</b><small>'+esc(names.get(t.user_id)||"Utilisateur")+' · '+new Date(t.last_message_at).toLocaleString()+' · '+(t.status==="open"?"مفتوح":"مغلق")+'</small></button>').join(""):'<div class="empty">لا توجد طلبات دعم بعد.</div>'}
async function open(id){current=rows.find(t=>t.id===id);if(!current)return;$("title").textContent=current.subject+" · "+current.status;$("messages").innerHTML="";$("compose").classList.toggle("hidden",current.status!=="open");const {data,error}=await db.from("support_messages").select("id,sender_id,body,created_at,read_at").eq("ticket_id",id).order("created_at");if(error){$("messages").textContent="تعذر تحميل المحادثة";return}(data||[]).forEach(append);const unread=(data||[]).filter(m=>m.sender_id!==user.id&&!m.read_at).map(m=>m.id);if(unread.length)await db.from("support_messages").update({read_at:new Date().toISOString()}).in("id",unread);if(channel)db.removeChannel(channel);channel=db.channel("souki-support-admin-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"support_messages",filter:"ticket_id=eq."+id},p=>{if(p.new.sender_id!==user.id)append(p.new);loadTickets().catch(()=>{})}).subscribe();await loadTickets()}
$("tickets").onclick=e=>{const b=e.target.closest("[data-id]");if(b)open(b.dataset.id)};
$("compose").onsubmit=async e=>{e.preventDefault();if(!current)return;const body=$("body").value.trim();if(!body)return;$("send").disabled=true;const {error}=await db.from("support_messages").insert({ticket_id:current.id,sender_id:user.id,body});$("send").disabled=false;if(error){alert("تعذر إرسال الرد: "+error.message);return}$("body").value="";const {data}=await db.from("support_messages").select("id,sender_id,body,created_at").eq("ticket_id",current.id).order("created_at",{ascending:false}).limit(1);if(data?.[0])append(data[0]);await loadTickets()};
async function init(){const {data:{user:u}}=await db.auth.getUser();user=u;if(!user){$("status").textContent="يجب تسجيل الدخول بحساب الإدارة.";return}const {data:admin}=await db.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();if(!admin){$("status").textContent="ليس لديك صلاحية الوصول إلى دعم العملاء.";return}$("status").classList.add("hidden");$("app").classList.remove("hidden");await loadTickets()}
init().catch(e=>$("status").textContent="حدث خطأ: "+e.message);
</script><script src="notifications.js?v=1"></script><script src="analytics.js?v=2"></script>  <script src="pull-to-refresh.js?v=1"></script>
</body></html>
