<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087443"><title>إضافة إعلان | SOUKI</title>
<style>
:root{--green:#087443;--green2:#0b9257;--ink:#18251e;--muted:#737d76;--bg:#f3f5f3;--line:#dfe5e1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line)}
.nav{width:min(850px,calc(100% - 28px));height:70px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{color:var(--green);font-size:25px;font-weight:900;text-decoration:none;white-space:nowrap}
.back{color:var(--green);font-weight:800;text-decoration:none;font-size:15px}
main{width:min(680px,calc(100% - 24px));margin:24px auto 50px}
.intro{margin:0 0 20px;padding:0 4px}
.intro h1{font-size:28px;margin:0 0 7px;font-weight:900}
.intro p{color:var(--muted);margin:0;line-height:1.8;font-size:16px}
.card{background:#fff;border:1px solid #e5e9e6;border-radius:22px;padding:25px 28px;box-shadow:0 5px 22px #18251e08}
.formgrid{display:grid;gap:20px}
.field label{display:block;font-weight:850;font-size:17px;margin-bottom:9px}
.field input,.field select,.field textarea{width:100%;border:1px solid #d9dfdb;border-radius:17px;padding:17px 19px;background:#fff;font:inherit;font-size:17px;color:var(--ink);min-height:64px;outline:none;transition:border-color .18s,box-shadow .18s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px #0b925714}
.field input::placeholder,.field textarea::placeholder{color:#8a918c}
.field textarea{min-height:150px;resize:vertical;line-height:1.7}
.field select{appearance:auto}
.field input[type=file]{min-height:58px;padding:10px;background:#f8faf8;border:1.5px dashed #b9c9be;border-radius:15px;font-size:14px}
.field input[type=file]::file-selector-button{border:0;border-radius:10px;background:#e8f3eb;color:var(--green);font-weight:850;padding:10px 14px;margin-inline-end:10px;cursor:pointer}
.hint{font-size:13px;color:var(--muted);line-height:1.8;margin-top:8px}
.preview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-top:12px}
.preview img{width:100%;height:92px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#f1f4f1}
.primary,.login{border:0;border-radius:15px;padding:17px;font:inherit;font-size:17px;font-weight:900;cursor:pointer}
.primary{background:var(--green);color:#fff;min-height:60px;box-shadow:0 5px 14px #08744320}
.primary:active{transform:translateY(1px)}
.login{background:#fff;border:1px solid var(--line);color:var(--green);width:100%;margin-top:12px}
.primary:disabled{opacity:.6;cursor:wait}
.notice{padding:16px;border-radius:14px;background:#fff8e6;color:#755514;line-height:1.8;margin-bottom:15px}
.hidden{display:none!important}
/* Keep contact choice at the bottom, directly after the WhatsApp number */
#adForm>#adPhoneField{order:6}
#adForm>#communicationModeField{order:7}
#adForm>.primary{order:8}
/* Visual order only: photos first, then product details */
#adForm>.field:nth-child(7){order:-1}
#adForm>.field:nth-child(1){order:0}
#adForm>.field:nth-child(2){order:1}
#adForm>.field:nth-child(5){order:2}
#adForm>.field:nth-child(3){order:3}
#adForm>.field:nth-child(4){order:4}
#adForm>.field:nth-child(6){order:5}
#adForm>.field:nth-child(8){order:6}
#adForm>.primary{order:7}
@media(max-width:560px){
 .nav{height:64px;width:calc(100% - 24px)}
 .brand{font-size:21px}
 .back{font-size:14px}
 main{width:100%;margin:18px auto 30px}
 .intro{padding:0 17px;margin-bottom:18px}
 .intro h1{font-size:25px}
 .intro p{font-size:15px}
 .card{padding:20px 17px;border-radius:0;border-inline:0;box-shadow:none}
 .formgrid{gap:21px}
 .field label{font-size:17px;margin-bottom:9px}
 .field input,.field select,.field textarea{font-size:17px;min-height:64px;padding:16px 17px;border-radius:17px}
 .field textarea{min-height:145px}
 .preview{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 .preview img{height:90px}
 .primary{width:100%;min-height:62px}
}

/* Preview image zoom lightbox */
.upload-box .preview{position:relative;z-index:4;pointer-events:auto}
.upload-box .preview img{cursor:zoom-in}
.image-lightbox{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:58px 14px 24px}
.image-lightbox.open{display:flex}
.image-lightbox img{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.lightbox-close{position:absolute;top:14px;right:16px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:32px;line-height:1;cursor:pointer}
/* Compact centered photo picker inspired by Facebook Marketplace */
.photo-field{text-align:right}
.upload-box{position:relative;width:100%;max-width:260px;min-height:190px;margin:0 auto 8px;padding:18px 12px;border:1.5px dashed #c5d1c9;border-radius:15px;background:#f8faf8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;overflow:hidden}
.upload-symbol{width:48px;height:48px;border-radius:50%;background:#e7ebef;color:#202a24;display:grid;place-items:center;font-size:32px;line-height:1}
.upload-box strong{font-size:15px;font-weight:800;color:var(--ink)}
.upload-button{display:inline-flex;padding:7px 14px;border-radius:9px;background:#e8f3eb;color:var(--green);font-size:13px;font-weight:800}
.upload-box input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:3;min-height:0;padding:0;border:0}
.upload-box .preview{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;margin:3px auto 0;max-width:100%;pointer-events:none}
.upload-box .preview img{width:48px;height:48px;object-fit:cover;border-radius:7px;border:1px solid #dce5de}
.upload-box.has-images{min-height:150px}
.upload-box.has-images .upload-symbol,.upload-box.has-images strong{display:none}
.upload-box.has-images .preview img{width:58px;height:58px}
@media(max-width:560px){
 .upload-box{width:100%;max-width:220px;min-height:165px;padding:14px 10px;border-radius:14px;gap:6px}
 .upload-symbol{width:44px;height:44px;font-size:29px}
 .upload-box strong{font-size:14px}
 .upload-button{font-size:12px;padding:7px 12px}
 .upload-box .preview img{width:46px;height:46px}
 .upload-box.has-images .preview img{width:54px;height:54px}
}
/* Ensure thumbnail taps open the preview, not the file picker */
.upload-box input[type=file]{z-index:1}
.upload-box .preview{position:relative;z-index:5;pointer-events:auto!important}
.upload-box .preview img{position:relative;z-index:6;pointer-events:auto;cursor:zoom-in;touch-action:manipulation}
.image-lightbox{padding:48px 0 12px}
.image-lightbox img{width:100vw;max-width:100vw;max-height:calc(100dvh - 60px);height:auto;object-fit:contain;border-radius:0}
@media(max-width:560px){
 .image-lightbox{padding:48px 0 10px}
 .image-lightbox img{width:100vw;max-width:100vw;max-height:calc(100dvh - 58px)}
}
/* Wide, video-shaped photo selection area */
.upload-box{width:100%;max-width:none;min-height:0;aspect-ratio:16/9;margin:0 auto 8px;padding:14px;border-radius:15px;gap:7px}
.upload-box.has-images{min-height:0}
.upload-box .preview{max-width:100%;max-height:100%;overflow:hidden}
.upload-box .preview img{width:clamp(58px,16vw,100px);height:clamp(58px,16vw,100px);object-fit:cover}
.upload-box.has-images .preview img{width:clamp(58px,16vw,100px);height:clamp(58px,16vw,100px)}
@media(max-width:560px){
 .upload-box{width:100%;max-width:none;aspect-ratio:16/9;min-height:0;padding:10px;border-radius:14px}
 .upload-box.has-images{min-height:0}
 .upload-box .preview{gap:7px}
 .upload-box .preview img,.upload-box.has-images .preview img{width:clamp(54px,16vw,92px);height:clamp(54px,16vw,92px)}
}
.lightbox-delete{position:absolute;top:14px;left:16px;min-height:42px;padding:0 17px;border:0;border-radius:22px;background:#dc2626;color:#fff;font-size:15px;font-weight:800;cursor:pointer;z-index:2}

#adForm>#publishBtn{order:8}

/* SOUKI compact, polished listing form */
.intro h1{font-size:24px;letter-spacing:-.25px}
.intro p{font-size:14px;line-height:1.7}
.card{padding:22px 24px;border-radius:20px}
.formgrid{gap:17px}
.field label{font-size:15px;margin-bottom:7px}
.field input,.field select,.field textarea{font-size:15px;min-height:56px;padding:13px 15px;border-radius:14px}
.field textarea{min-height:128px}
.hint{font-size:11px;line-height:1.65;margin-top:6px}
.primary,.login{font-size:15px;border-radius:13px}
.primary{min-height:54px;padding:14px 16px}
.upload-box{border-radius:14px}
.upload-box strong{font-size:14px}
.upload-button{font-size:12px}
@media(max-width:560px){
 .nav{height:58px}
 .brand{font-size:19px}
 .back{font-size:12px}
 main{margin:13px auto 24px}
 .intro{padding:0 15px;margin-bottom:13px}
 .intro h1{font-size:21px;margin-bottom:5px}
 .intro p{font-size:12px;line-height:1.65}
 .card{padding:15px 15px 18px;border-radius:0}
 .formgrid{gap:15px}
 .field label{font-size:14px;margin-bottom:6px}
 .field input,.field select,.field textarea{font-size:14px;min-height:52px;padding:12px 13px;border-radius:13px}
 .field textarea{min-height:112px}
 .field input[type=file]{font-size:12px}
 .hint{font-size:10px;line-height:1.6}
 .upload-box{aspect-ratio:16/8.5;padding:9px;border-radius:13px}
 .upload-symbol{width:40px;height:40px;font-size:27px}
 .upload-box strong{font-size:13px}
 .upload-button{font-size:11px;padding:6px 11px}
 .primary,.login{font-size:14px}
 .primary{min-height:50px;padding:12px 14px}
}
</style><script id="souki-language-bootstrap">(()=>{try{const v=localStorage.getItem("souki-language");if(v&&["ar","fr","en"].includes(v)){document.documentElement.lang=v;document.documentElement.dir=v==="ar"?"rtl":"ltr"}}catch(e){}})();</script>
<link rel="stylesheet" href="theme.css?v=3"><script src="theme.js?v=1"></script></head>
<body>
<header><div class="nav"><a class="brand" href="./">سوقي · SOUKI</a><a class="back" href="./">← العودة إلى السوق</a></div></header>
<main>
<div id="authNotice" class="notice hidden">لإضافة إعلان، سجّل الدخول أولاً إلى حسابك في سوقي.<button class="login" id="loginBtn" type="button">تسجيل الدخول باستخدام Google</button></div>
<section class="card">
<form class="formgrid" id="adForm">
<div class="field"><label for="adTitle">اسم المنتج</label><input id="adTitle" maxlength="90" required placeholder="مثلاً: iPhone 13 أو Samsung Galaxy"></div>
<div class="field"><label for="adPrice">السعر بالدرهم</label><input id="adPrice" type="number" min="0" step="0.01" required placeholder="أدخل السعر"></div>
<div class="field"><label for="adCondition">حالة المنتج</label><select id="adCondition" required><option value="">اختر حالة المنتج</option><option value="new">✨ جديد</option><option value="used">♻️ مستعمل</option></select></div>
<div class="field"><label for="adDescription">وصف الإعلان</label><textarea id="adDescription" maxlength="5000" placeholder="اكتب تفاصيل المنتج وحالته ومميزاته..."></textarea></div>
<div class="field"><label for="adCategory">الفئة</label><select id="adCategory" required><option value="">اختر الفئة</option></select></div>
<div class="field"><label for="adCity">المدينة</label><select id="adCity" required><option value="">اختر المدينة</option></select></div>
<div class="field photo-field"><label for="adImages">صور المنتج (حتى 5 صور)</label><div class="upload-box" id="uploadBox"><div class="upload-symbol">＋</div><strong>إضافة صور</strong><span class="upload-button">اختيار من الهاتف</span><div class="preview" id="imagePreview"></div><input id="adImages" type="file" accept="image/*" multiple required aria-label="اختيار صور المنتج"></div><div class="hint">اختر صورة واحدة على الأقل، وحتى 5 صور.</div></div>
<div class="field" id="adPhoneField"><label for="adPhone">رقم WhatsApp</label><input id="adPhone" type="tel" inputmode="numeric" placeholder="2126XXXXXXXX"><div class="hint">اكتب الرقم مع رمز الدولة، مثلاً 212.</div></div>
<div class="field" id="communicationModeField"><label for="communicationMode">طريقة التواصل معك</label><select id="communicationMode" required><option value="both" selected>💬 محادثة داخل سوقي + WhatsApp</option><option value="chat">💬 المحادثة داخل سوقي فقط</option><option value="whatsapp">🟢 WhatsApp فقط</option></select><div class="hint">اختر كيف تريد أن يتواصل معك المشترون بخصوص هذا الإعلان.</div></div>
<button class="primary" id="publishBtn" type="submit">نشر الإعلان</button>
</form></section></main>
<div id="imageLightbox" class="image-lightbox" aria-hidden="true"><button type="button" class="lightbox-close" id="lightboxClose" aria-label="إغلاق">×</button><button type="button" class="lightbox-delete" id="lightboxDelete">حذف الصورة</button><img id="lightboxImage" alt="عرض الصورة بالحجم الكبير"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fvaffhfopoxgrofyilqx.supabase.co";
const SUPABASE_KEY="sb_publishable_R5BievMMk58RUAgrz4Jz4g_SdBRIXEX";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);window.soukiAuthClient=db;
const $=id=>document.getElementById(id);
const categories=["سيارات","عقارات","هواتف وإلكترونيات","حواسيب وألعاب","ملابس وأحذية","أثاث ومنزل","أجهزة منزلية","حيوانات","وظائف وخدمات","معدات وأدوات","أخرى"];
const cities=["الدار البيضاء","الرباط","مراكش","فاس","طنجة","أكادير","مكناس","وجدة","القنيطرة","تطوان","آسفي","الجديدة","الناظور","بني ملال","خريبكة","العيون","الداخلة","ورزازات","الصويرة","سطات"];
function fill(id,items){const select=$(id);const placeholder=select.options[0];select.replaceChildren(placeholder);items.forEach(value=>{const option=document.createElement("option");option.value=value;option.textContent=value;select.add(option)});select.selectedIndex=0;select.disabled=false}
fill("adCategory",categories);fill("adCity",cities);
function updateContactFields(){const mode=$("communicationMode").value;const needsWhatsApp=mode==="whatsapp"||mode==="both";$("adPhoneField").classList.toggle("hidden",!needsWhatsApp);$("adPhone").required=needsWhatsApp;if(!needsWhatsApp)$("adPhone").value=""}
$("communicationMode").addEventListener("change",updateContactFields);
updateContactFields();
async function currentUser(){const {data:{user}}=await db.auth.getUser();return user}
async function checkAuth(){const user=await currentUser();$("authNotice").classList.toggle("hidden",!!user);$("adForm").classList.toggle("hidden",!user);return user}
$("loginBtn").onclick=async()=>{try{if(window.soukiNativeGoogleLogin){await window.soukiNativeGoogleLogin(db);return}const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.href}});if(error)alert("تعذر تسجيل الدخول: "+error.message)}catch(error){alert("تعذر تسجيل الدخول: "+(error.message||error))}};
let activeImageIndex=-1;
function renderSelectedImages(){const files=[...$("adImages").files];$("imagePreview").innerHTML=files.map((f,i)=>'<img data-index="'+i+'" alt="معاينة الصورة" src="'+URL.createObjectURL(f)+'">').join("");$("uploadBox").classList.toggle("has-images",files.length>0)}
$("adImages").onchange=()=>{const files=[...$("adImages").files];if(files.length>5||files.some(f=>!f.type.startsWith("image/")||f.size>5*1024*1024)){$("adImages").value="";$("imagePreview").innerHTML="";$("uploadBox").classList.remove("has-images");alert("اختر حتى 5 صور، ويجب ألا يتجاوز حجم كل صورة 5 ميغابايت.");return}renderSelectedImages()};
$("imagePreview").addEventListener("click",e=>{const thumb=e.target.closest("img");if(!thumb)return;e.preventDefault();e.stopPropagation();activeImageIndex=Number(thumb.dataset.index);$("lightboxImage").src=thumb.src;$("imageLightbox").classList.add("open");$("imageLightbox").setAttribute("aria-hidden","false");document.body.style.overflow="hidden"} ,true);
function closeLightbox(){$("imageLightbox").classList.remove("open");$("imageLightbox").setAttribute("aria-hidden","true");$("lightboxImage").removeAttribute("src");document.body.style.overflow=""}
$("lightboxClose").addEventListener("click",closeLightbox);
$("lightboxDelete").addEventListener("click",()=>{if(activeImageIndex<0)return;const transfer=new DataTransfer();[...$("adImages").files].forEach((file,index)=>{if(index!==activeImageIndex)transfer.items.add(file)});$("adImages").files=transfer.files;closeLightbox();activeImageIndex=-1;renderSelectedImages()});

$("imageLightbox").addEventListener("click",e=>{if(e.target===$("imageLightbox"))closeLightbox()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLightbox()});

$("adForm").onsubmit=async e=>{e.preventDefault();const user=await currentUser();if(!user){await checkAuth();return}
const title=$("adTitle").value.trim(),price=Number($("adPrice").value),condition=$("adCondition").value,category=$("adCategory").value,city=$("adCity").value,files=[...$("adImages").files];
const mode=$("communicationMode").value,phone=$("adPhone").value.replace(/\D/g,"");if(!title||!Number.isFinite(price)||price<0||!condition||!category||!city||!["chat","whatsapp","both"].includes(mode)||((mode==="whatsapp"||mode==="both")&&!phone)||files.length<1||files.length>5){alert("يرجى إكمال الحقول المطلوبة واختيار صورة واحدة على الأقل، وإدخال رقم WhatsApp عند اختياره.");return}
const btn=$("publishBtn");btn.disabled=true;btn.textContent="جارٍ نشر الإعلان...";
try{const imageUrls=[];for(const file of files){const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const path=user.id+"/"+crypto.randomUUID()+"."+ext;const {error:upErr}=await db.storage.from("listing-images").upload(path,file,{contentType:file.type,upsert:false});if(upErr)throw upErr;const {data}=db.storage.from("listing-images").getPublicUrl(path);imageUrls.push(data.publicUrl)}
const payload={seller_id:user.id,title,description:$("adDescription").value.trim(),price,product_condition:condition,category,city,whatsapp:phone,communication_mode:mode,image_urls:imageUrls};
const {error}=await db.from("listings").insert(payload);if(error)throw error;
sessionStorage.setItem("souki-success-toast","تم نشر إعلانك بنجاح!");location.href="./?published=1#latest";
}catch(err){alert("تعذر نشر الإعلان: "+err.message);btn.disabled=false;btn.textContent="نشر الإعلان"}
};
checkAuth();
</script><script src="notifications.js?v=1"></script><script src="analytics.js?v=2"></script><script src="language.js?v=4"></script>
<script type="module" src="native-auth.js?v=1"></script>  <script src="pull-to-refresh.js?v=1"></script>
</body></html>
