<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087443">
<meta name="description" content="الملف الشخصي للبائع وإعلاناته على سوقي SOUKI.">
<title>ملف البائع | SOUKI سوقي</title>
<style>
:root{--green:#087443;--green2:#0b9257;--ink:#18251e;--muted:#6b776f;--bg:#f4f7f4;--line:#e3eae4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line)}.nav{height:62px;width:min(1050px,calc(100% - 26px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:900;color:var(--green);text-decoration:none}.back{color:var(--green);font-weight:800;text-decoration:none}
main{width:min(1050px,calc(100% - 24px));margin:20px auto 45px}.profile{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;display:flex;align-items:center;gap:15px}.avatar{width:88px;height:88px;object-fit:cover;border-radius:50%;background:#edf3ee;border:2px solid #e5eee7}.identity{min-width:0;flex:1}.name{font-size:22px;font-weight:900}.city{color:var(--muted);margin-top:5px}.stats{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px}.follow{border:0;background:var(--green);color:#fff;border-radius:22px;padding:10px 18px;font:inherit;font-weight:800;white-space:nowrap}.follow.following{background:#edf7f0;color:var(--green);border:1px solid #cfe5d5}.follow:disabled{opacity:.6}.heading{display:flex;align-items:center;justify-content:space-between;margin:23px 2px 13px}.heading h2{margin:0;font-size:20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.product{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit}.photo{width:100%;height:180px;object-fit:cover;background:#eef2ee;display:block}.body{padding:11px}.title{font-weight:750;line-height:1.5;min-height:43px}.price{font-weight:900;color:var(--green);font-size:18px;margin-top:7px}.meta{font-size:12px;color:var(--muted);margin-top:6px}.state{background:#fff;border:1px dashed #cbd8ce;border-radius:14px;padding:25px;text-align:center;color:var(--muted);grid-column:1/-1}.hidden{display:none!important}
@media(max-width:650px){main{margin-top:12px}.profile{padding:15px;gap:11px;flex-wrap:wrap}.avatar{width:70px;height:70px}.name{font-size:18px}.follow{padding:9px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo{height:clamp(140px,48vw,195px)}.body{padding:9px}.title{font-size:13px}.price{font-size:16px}.heading h2{font-size:18px}}
</style><script id="souki-language-bootstrap">(()=>{try{const v=localStorage.getItem("souki-language");if(v&&["ar","fr","en"].includes(v)){document.documentElement.lang=v;document.documentElement.dir=v==="ar"?"rtl":"ltr"}}catch(e){}})();</script>
<link rel="stylesheet" href="theme.css?v=1"><script src="theme.js?v=1"></script></head>
<body><header><div class="nav"><a class="brand" href="./">سوقي · SOUKI</a><a class="back" href="./#latest">← العودة إلى الإعلانات</a></div></header>
<main><section class="profile" id="profile"><img class="avatar" id="avatar" src="https://www.gravatar.com/avatar/?d=mp" alt="صورة البائع"><div class="identity"><div class="name" id="name">جارٍ تحميل الملف الشخصي...</div><div class="city" id="city"></div><div class="stats"><span id="followers">👥 جارٍ تحميل المتابعين...</span><span id="adsCount"></span></div></div><button class="follow" id="follow" hidden>+ متابعة</button></section>
<div class="heading"><h2 id="adsHeading">إعلانات هذا البائع</h2></div><section class="grid" id="ads"><div class="state">جارٍ تحميل الإعلانات...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fvaffhfopoxgrofyilqx.supabase.co",KEY="sb_publishable_R5BievMMk58RUAgrz4Jz4g_SdBRIXEX";
const db=window.supabase.createClient(SUPABASE_URL,KEY),pub=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const $=id=>document.getElementById(id),sellerId=new URLSearchParams(location.search).get("id");
const lang=(()=>{try{return localStorage.getItem("souki-language")||"ar"}catch(e){return"ar"}})();
const isFr=lang==="fr",isEn=lang==="en";
const tr={loadingProfile:isFr?"Chargement du profil…":isEn?"Loading seller profile…":"جارٍ تحميل الملف الشخصي...",loadingFollowers:isFr?"Chargement des abonnés…":isEn?"Loading followers…":"جارٍ تحميل المتابعين...",loadingAds:isFr?"Chargement des annonces…":isEn?"Loading ads…":"جارٍ تحميل الإعلانات...",seller:isFr?"Vendeur sur SOUKI":isEn?"SOUKI seller":"بائع على سوقي",member:isFr?"Membre de SOUKI":isEn?"SOUKI member":"عضو في سوقي",adsHeading:isFr?"Annonces de ce vendeur":isEn?"Seller listings":"إعلانات هذا البائع",follow:isFr?"Suivre":isEn?"Follow":"+ متابعة",following:isFr?"✓ Suivi":isEn?"✓ Following":"✓ تتابعه",followers:n=>isFr?`${n} abonnés`:isEn?`${n} followers`:`${n} متابع`,ads:n=>isFr?`${n} annonces`:isEn?`${n} ads`:`${n} إعلان`,back:isFr?"← Retour aux annonces":isEn?"← Back to listings":"← العودة إلى الإعلانات",login:isFr?"Veuillez vous connecter d’abord pour suivre ce vendeur.":isEn?"Please sign in first to follow this seller.":"يرجى تسجيل الدخول أولاً لمتابعة البائع.",noAds:isFr?"Aucune annonce disponible pour ce vendeur pour le moment.":isEn?"This seller has no available listings right now.":"لا توجد إعلانات متاحة لهذا البائع حالياً.",adsError:isFr?"Impossible de charger les annonces de ce vendeur. Actualisez la page.":isEn?"Could not load this seller’s listings. Please refresh.":"تعذر تحميل إعلانات هذا البائع. حاول تحديث الصفحة.",followError:isFr?"Impossible de mettre à jour l’abonnement. Réessayez.":isEn?"Could not update follow status. Please try again.":"تعذر تحديث المتابعة. حاول مرة أخرى."};
const number=n=>Number(n||0).toLocaleString(isFr?"fr-FR":isEn?"en-US":"ar-MA");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){
 const showError=message=>{$("name").textContent=message;$("followers").textContent="";$("ads").innerHTML='<div class="state">'+esc(message)+'</div>';};
 const timeout=(promise,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error("انتهت مهلة الاتصال أثناء تحميل "+label)),15000))]);
 if(!sellerId){showError("رابط الملف الشخصي غير صحيح.");return;}
 const [profileResult,adsResult,followersResult]=await timeout(Promise.all([
  pub.from("profiles").select("display_name,avatar_url").eq("id",sellerId).maybeSingle(),
  pub.from("listings").select("id,title,price,city,image_urls,created_at,status").eq("seller_id",sellerId).eq("status","active").order("created_at",{ascending:false}),
  pub.from("seller_follows").select("seller_id",{count:"exact",head:true}).eq("seller_id",sellerId)
 ]),"بيانات البائع");
 if(profileResult.error)console.error("Seller profile:",profileResult.error);
 if(adsResult.error)console.error("Seller ads:",adsResult.error);
 if(followersResult.error)console.error("Seller followers:",followersResult.error);
 const profile=profileResult.data,ads=adsResult.data||[];
 $("name").textContent=profile?.display_name||tr.seller;
 $("adsHeading").textContent=tr.adsHeading;
 document.querySelector(".back").textContent=tr.back;
 $("avatar").src=profile?.avatar_url||"https://www.gravatar.com/avatar/?d=mp";
 $("followers").textContent=followersResult.error?"":"👥 "+tr.followers(number(followersResult.count));
 $("city").textContent=ads.length?"📍 "+(ads[0].city||""):tr.member;
 $("adsCount").textContent="🛍️ "+tr.ads(number(ads.length));
 if(adsResult.error){$("ads").innerHTML='<div class="state">'+esc(tr.adsError)+'</div>';return;}
 if(!ads.length){$("ads").innerHTML='<div class="state">'+esc(tr.noAds)+'</div>';}
 else{$("ads").innerHTML=ads.map(ad=>{const img=Array.isArray(ad.image_urls)&&ad.image_urls[0]?ad.image_urls[0]:"https://www.gravatar.com/avatar/?d=mp";return '<a class="product" href="listing.html?id='+encodeURIComponent(ad.id)+'"><img class="photo" loading="lazy" src="'+esc(img)+'" alt=""><div class="body"><div class="title">'+esc(ad.title)+'</div><div class="price">'+Number(ad.price||0).toLocaleString("ar-MA")+' درهم</div><div class="meta">📍 '+esc(ad.city)+'</div></div></a>';}).join("");}
 const btn=$("follow");
 const {data:sessionData}=await db.auth.getSession();
 const user=sessionData?.session?.user||null;
 if(user?.id===sellerId)return;
 btn.hidden=false;
 if(!user){btn.textContent=tr.follow;btn.onclick=()=>alert(tr.login);return;}
 const existingResult=await db.from("seller_follows").select("seller_id").eq("follower_id",user.id).eq("seller_id",sellerId).maybeSingle();
 let following=!!existingResult.data;
 const draw=()=>{btn.textContent=following?tr.following:tr.follow;btn.classList.toggle("following",following);};draw();
 btn.onclick=async()=>{btn.disabled=true;const result=following?await db.from("seller_follows").delete().eq("follower_id",user.id).eq("seller_id",sellerId):await db.from("seller_follows").insert({follower_id:user.id,seller_id:sellerId});if(result.error){alert(tr.followError);console.error("Follow action:",result.error);}else{following=!following;draw();const n=await pub.from("seller_follows").select("seller_id",{count:"exact",head:true}).eq("seller_id",sellerId);if(!n.error)$("followers").textContent="👥 "+tr.followers(number(n.count));}btn.disabled=false;};
}
init().catch(error=>{$("name").textContent="تعذر تحميل الملف الشخصي";$("followers").textContent="";$("ads").innerHTML='<div class="state">'+esc(error?.message||"حدث خطأ أثناء تحميل الملف الشخصي. أعد المحاولة.")+'</div>';console.error("Seller page error:",error);});
</script><script src="notifications.js?v=1"></script><script src="analytics.js?v=2"></script><script src="language.js?v=4"></script>

</body></html>
