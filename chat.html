<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087443"><title>المحادثة | سوقي</title>
<style>
:root{--g:#087443;--ink:#18251e;--muted:#718078;--line:#e2e9e4;--bg:#f3f6f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Tahoma,Arial}.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100% - 760px)/2))}.top a{color:var(--g);font-weight:850;text-decoration:none}.wrap{max-width:760px;margin:18px auto;padding:0 12px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.head{padding:15px 18px;border-bottom:1px solid var(--line)}.head strong{font-size:17px}.head small{display:block;color:var(--muted);margin-top:4px}.messages{height:min(58vh,560px);min-height:300px;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;padding:10px 13px;border-radius:14px;background:#eef3ef;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.bubble.mine{background:#e1f4e8;align-self:flex-end}.bubble time{display:block;font-size:10px;color:#738078;margin-top:4px}.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}textarea{flex:1;resize:none;min-height:48px;max-height:130px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:10px 15px;font-weight:800}.send{background:var(--g);color:white}.tools{display:flex;gap:8px;padding:0 12px 12px}.minor{background:#f1f4f1;color:#46534b;font-size:12px}.status{padding:20px;text-align:center;color:var(--muted)}.login{background:var(--g);color:#fff}.hidden{display:none!important}@media(max-width:560px){.wrap{margin:0;padding:0}.panel{border-radius:0;border-inline:0}.messages{height:calc(100dvh - 220px)}.top{height:54px}}
</style><script id="souki-language-bootstrap">(()=>{try{const v=localStorage.getItem("souki-language");if(v&&["ar","fr","en"].includes(v)){document.documentElement.lang=v;document.documentElement.dir=v==="ar"?"rtl":"ltr"}}catch(e){}})();</script>
</head><body>
<header class="top"><a href="./">سوقي · SOUKI</a><a href="messages.html">صندوق الرسائل ←</a></header>
<main class="wrap"><section class="panel"><div class="head"><strong id="title">محادثة الإعلان</strong><small id="subtitle">رسائلك الخاصة مع البائع</small></div><div id="status" class="status">جارٍ تحميل المحادثة...</div><div id="messages" class="messages hidden" aria-live="polite"></div><form id="compose" class="compose hidden"><textarea id="body" maxlength="4000" placeholder="اكتب رسالتك..." required></textarea><button class="send" id="send" type="submit">إرسال</button></form><div id="tools" class="tools hidden"><button class="minor" id="block" type="button">حظر المستخدم</button><button class="minor" id="report" type="button">الإبلاغ عن المحادثة</button></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://fvaffhfopoxgrofyilqx.supabase.co","sb_publishable_R5BievMMk58RUAgrz4Jz4g_SdBRIXEX"),$=id=>document.getElementById(id),params=new URLSearchParams(location.search),listingId=params.get("listing"),conversationId=params.get("id");
let user=null,conversation=null,otherId=null,channel=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function showStatus(s){$("status").textContent=s;$("status").classList.remove("hidden")}
function reveal(){ $("status").classList.add("hidden");$("messages").classList.remove("hidden");$("compose").classList.remove("hidden");$("tools").classList.remove("hidden")}
async function load(){
 const auth=await db.auth.getUser();user=auth.data.user;
 if(!user){showStatus("يجب تسجيل الدخول قبل إرسال الرسائل.");const b=document.createElement("button");b.className="login";b.textContent="تسجيل الدخول باستخدام Google";b.onclick=async()=>{const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.href}});if(error)alert(error.message)};$("status").appendChild(document.createElement("br"));$("status").appendChild(b);return}
 if(listingId){
  const {data:l,error}=await db.from("listings").select("id,seller_id,title,status,communication_mode").eq("id",listingId).maybeSingle();
  if(error||!l||l.status!=="active"){showStatus("الإعلان غير متاح للمراسلة.");return}
  if(l.seller_id===user.id){showStatus("لا يمكنك بدء محادثة مع نفسك.");return}
  if(!["chat","both"].includes(l.communication_mode||"whatsapp")){showStatus("هذا الإعلان لا يقبل الرسائل الداخلية.");return}
  otherId=l.seller_id;$("title").textContent=l.title;$("subtitle").textContent="محادثة خاصة مع البائع";
  let found=await db.from("conversations").select("*").eq("listing_id",listingId).eq("buyer_id",user.id).maybeSingle();
  if(found.error){showStatus("تعذر فتح المحادثة: "+found.error.message);return}
  if(found.data)conversation=found.data;
  else{const made=await db.from("conversations").insert({listing_id:listingId,buyer_id:user.id,seller_id:l.seller_id}).select("*").single();if(made.error){showStatus("تعذر إنشاء المحادثة. قد يكون أحد الطرفين قد حظرك.");return}conversation=made.data}
 }else if(conversationId){
  const got=await db.from("conversations").select("*,listings(title)").eq("id",conversationId).maybeSingle();
  if(got.error||!got.data){showStatus("المحادثة غير موجودة أو لا تملك صلاحية الوصول إليها.");return}
  conversation=got.data;if(user.id!==conversation.buyer_id&&user.id!==conversation.seller_id){showStatus("ليس لديك صلاحية الوصول إلى هذه المحادثة.");return}
  otherId=user.id===conversation.buyer_id?conversation.seller_id:conversation.buyer_id;$("title").textContent=conversation.listings?.title||"محادثة سوقي";
 }else{showStatus("رابط المحادثة غير صحيح.");return}
 const blocked=await db.from("user_blocks").select("id").or("and(blocker_id.eq."+user.id+",blocked_id.eq."+otherId+"),and(blocker_id.eq."+otherId+",blocked_id.eq."+user.id+")");
 if(blocked.data?.length){showStatus("لا يمكن إرسال الرسائل بسبب وجود حظر بين الطرفين.");return}
 reveal();await loadMessages();
 channel=db.channel("souki-chat-"+conversation.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+conversation.id},payload=>{if(payload.new.sender_id!==user.id)appendMessage(payload.new);}).subscribe();
}
function appendMessage(m){if(document.querySelector('[data-message="'+m.id+'"]'))return;const el=document.createElement("div");el.className="bubble"+(m.sender_id===user.id?" mine":"");el.dataset.message=m.id;const time=new Date(m.created_at).toLocaleString("ar-MA",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"});el.innerHTML=esc(m.body)+'<time>'+time+'</time>';$("messages").appendChild(el);$("messages").scrollTop=$("messages").scrollHeight}
async function loadMessages(){const {data,error}=await db.from("messages").select("id,sender_id,body,created_at,read_at").eq("conversation_id",conversation.id).order("created_at",{ascending:true}).limit(300);if(error){showStatus("تعذر تحميل الرسائل.");return}(data||[]).forEach(appendMessage);const unread=(data||[]).filter(m=>m.sender_id!==user.id&&!m.read_at).map(m=>m.id);if(unread.length)await db.from("messages").update({read_at:new Date().toISOString()}).in("id",unread);$("messages").scrollTop=$("messages").scrollHeight}
$("compose").onsubmit=async e=>{e.preventDefault();const body=$("body").value.trim();if(!body||!conversation)return;$("send").disabled=true;const {data:sent,error}=await db.from("messages").insert({conversation_id:conversation.id,sender_id:user.id,body}).select("id,sender_id,body,created_at,read_at").single();if(error)alert("تعذر إرسال الرسالة: "+error.message);else{$("body").value="";appendMessage(sent);db.functions.invoke("send-chat-push",{body:{message_id:sent.id}}).then(({error})=>{if(error)console.warn("Push notification was not delivered:",error.message)}).catch(err=>console.warn("Push notification error:",err));} $("send").disabled=false};
$("block").onclick=async()=>{if(!confirm("هل تريد حظر هذا المستخدم؟ لن تتمكنوا من تبادل الرسائل."))return;const {error}=await db.from("user_blocks").insert({blocker_id:user.id,blocked_id:otherId});if(error&&error.code!=="23505")alert("تعذر الحظر: "+error.message);else{showStatus("تم حظر المستخدم، ولن تتمكنوا من تبادل الرسائل.");$("messages").classList.add("hidden");$("compose").classList.add("hidden");}};
$("report").onclick=async()=>{const reason=prompt("اكتب سبب الإبلاغ عن هذه المحادثة:");if(!reason||reason.trim().length<3)return;const {error}=await db.from("conversation_reports").insert({conversation_id:conversation.id,reporter_id:user.id,reported_user_id:otherId,reason:reason.trim()});alert(error?"تعذر إرسال البلاغ: "+error.message:"تم إرسال البلاغ، شكراً لمساعدتنا.");};
load().catch(e=>showStatus("حدث خطأ: "+e.message));
</script><script src="notifications.js?v=1"></script><script src="analytics.js?v=2"></script><script src="language.js?v=2"></script>
</body></html>
