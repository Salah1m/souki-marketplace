<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087443"><title>إدارة الحسابات | SOUKI</title>
<style>
:root{--green:#087443;--ink:#18251e;--muted:#6b776f;--bg:#f4f7f4;--line:#e3eae4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.nav{width:min(1100px,calc(100% - 24px));height:64px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand,.back{color:var(--green);font-weight:900;text-decoration:none}.brand{font-size:21px}main{width:min(1100px,calc(100% - 24px));margin:22px auto 50px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.head h1{margin:0;font-size:24px}.sub{color:var(--muted);font-size:14px}.bar{display:flex;gap:9px;margin:16px 0}.bar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;background:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:white;font:inherit;font-weight:800;cursor:pointer}.count{background:#eaf6ee;color:var(--green);border-radius:10px;padding:10px 13px;font-weight:900}.list{display:grid;gap:10px}.user{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;align-items:center;gap:12px;justify-content:space-between}.info{min-width:0}.name{font-weight:900;font-size:16px}.email{direction:ltr;text-align:right;overflow-wrap:anywhere;color:#536158;font-size:14px;margin-top:5px}.meta{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap}.ban{border:0;background:#fff0f0;color:#b42318;border-radius:9px;padding:9px 12px;font:inherit;font-weight:800;cursor:pointer}.unban{border:0;background:#eaf6ee;color:#087443;border-radius:9px;padding:9px 12px;font:inherit;font-weight:800;cursor:pointer}.admin{font-size:12px;color:#805400;background:#fff5d9;padding:5px 8px;border-radius:20px}.detailsBtn{border:0;background:#eaf6ee;color:#087443;border-radius:9px;padding:9px 12px;font:inherit;font-weight:800;cursor:pointer}.userDetails{width:100%;border-top:1px solid var(--line);padding-top:14px;margin-top:8px}.detailStats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.detailPill{background:#f1f6f2;border-radius:9px;padding:7px 10px;font-size:13px}.listingRow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #edf1ed}.listingRow img{width:66px;height:66px;object-fit:cover;border-radius:9px;background:#edf1ed}.listingInfo{min-width:0;flex:1}.listingTitle{font-weight:800}.listingMeta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}.statusTag{font-size:12px;background:#eaf6ee;color:#087443;border-radius:20px;padding:4px 8px;white-space:nowrap}.empty,.notice{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;text-align:center;color:var(--muted)}.notice{margin-bottom:12px;line-height:1.7}.hidden{display:none!important}button:disabled{opacity:.6}
@media(max-width:600px){.user{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.head h1{font-size:21px}}
</style><script id="souki-language-bootstrap">(()=>{try{const v=localStorage.getItem("souki-language");if(v&&["ar","fr","en"].includes(v)){document.documentElement.lang=v;document.documentElement.dir=v==="ar"?"rtl":"ltr"}}catch(e){}})();</script>
</head><body>
<header><div class="nav"><a class="brand" href="./">سوقي · SOUKI</a><a class="back" href="analytics.html">← الإحصائيات</a></div></header>
<main><div class="head"><h1>👥 إدارة الحسابات المسجلة</h1><span class="count" id="count">— حساب</span></div><p class="sub">عرض أسماء المستخدمين وبريدهم الإلكتروني وإدارة حظر الحسابات المخالفة.</p>
<div id="notice" class="notice">يتم تجهيز صفحة إدارة الحسابات...</div>
<section id="panel" class="hidden"><div class="bar"><input id="search" placeholder="ابحث بالاسم أو البريد الإلكتروني"><button class="btn" id="reload" type="button">تحديث ↻</button></div><div id="list" class="list"></div></section></main>
<script>
const BASE="https://fvaffhfopoxgrofyilqx.supabase.co",KEY="sb_publishable_R5BievMMk58RUAgrz4Jz4g_SdBRIXEX", $=id=>document.getElementById(id);
let users=[],accessToken="";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const timeout=(p,label)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("انتهت مهلة الاتصال: "+label)),15000))]);
function getSession(){
 const keys=Object.keys(localStorage).filter(k=>k.startsWith("sb-")&&k.endsWith("-auth-token"));
 for(const k of keys){try{const v=JSON.parse(localStorage.getItem(k)||"null");if(v?.access_token)return v;if(v?.currentSession?.access_token)return v.currentSession}catch(e){}}
 return null;
}
async function api(path,options={}){
 const headers={"apikey":KEY,"Authorization":"Bearer "+accessToken,...(options.headers||{})};
 const res=await timeout(fetch(BASE+path,{...options,headers}),"الاتصال بخادم سوقي");
 const raw=await res.text();let data;try{data=raw?JSON.parse(raw):null}catch(e){data=raw}
 if(!res.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||("خطأ HTTP "+res.status));
 return data;
}
async function invoke(action,user_id){
 const data=await api("/functions/v1/admin-users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,user_id})});
 if(data?.error)throw new Error(data.error);return data;
}
async function init(){
 try{
  $("notice").textContent="جارٍ البحث عن جلسة دخول المدير...";
  const session=getSession();
  if(!session?.access_token){$("notice").textContent="لم نعثر على جلسة دخول محفوظة. افتح سوقي، سجّل الدخول بحساب المدير، ثم افتح إدارة الحسابات من جديد.";return}
  accessToken=session.access_token;
  $("notice").textContent="جارٍ التحقق من حساب المدير...";
  const user=await api("/auth/v1/user");
  const admins=await api("/rest/v1/admins?select=user_id&user_id=eq."+encodeURIComponent(user.id));
  if(!admins?.length){$("notice").textContent="الحساب الذي دخلت به ليس ضمن حسابات الإدارة.";return}
  $("panel").classList.remove("hidden");$("notice").classList.add("hidden");await load();
 }catch(e){$("notice").textContent="تعذر فتح إدارة الحسابات: "+(e?.message||"خطأ غير معروف")}
}
async function load(){
 $("list").innerHTML='<div class="empty">جارٍ تحميل الحسابات...</div>';$("reload").disabled=true;
 try{const data=await invoke("list");users=data.users||[];$("count").textContent=users.length.toLocaleString("ar-MA")+" حساب";render()}
 catch(e){$("list").innerHTML='<div class="empty">تعذر تحميل الحسابات: '+esc(e.message)+'</div>'}
 finally{$("reload").disabled=false}
}
function render(){
 const q=$("search").value.trim().toLowerCase(),rows=users.filter(u=>(u.name+" "+u.email).toLowerCase().includes(q));
 if(!rows.length){$("list").innerHTML='<div class="empty">لا توجد حسابات مطابقة.</div>';return}
 $("list").innerHTML=rows.map(u=>{
  const banned=!!u.banned_until&&new Date(u.banned_until)>new Date();
  return '<article class="user" data-user-card="'+esc(u.id)+'"><div class="info"><div class="name">'+esc(u.name)+(u.is_admin?' <span class="admin">مدير</span>':'')+'</div><div class="email">'+esc(u.email||"لا يوجد بريد إلكتروني")+'</div><div class="meta">تاريخ التسجيل: '+(u.created_at?new Date(u.created_at).toLocaleDateString("ar-MA"):"غير متوفر")+(banned?' · <b style="color:#b42318">محظور</b>':'')+'</div></div><div class="actions"><button class="detailsBtn" data-details="'+esc(u.id)+'">عرض التفاصيل</button>'+(u.is_admin?'<span class="admin">حساب إدارة محمي</span>':banned?'<button class="unban" data-unban="'+esc(u.id)+'">فك الحظر</button>':'<button class="ban" data-ban="'+esc(u.id)+'">حظر الحساب</button>')+'</div><div class="userDetails hidden" id="details-'+esc(u.id)+'"></div></article>'
 }).join("");
}
$("search").addEventListener("input",render);$("reload").addEventListener("click",load);
$("list").addEventListener("click",async e=>{
 const d=e.target.closest("[data-details]");
 if(d){const id=d.dataset.details,box=$("details-"+id);if(!box)return;if(!box.classList.contains("hidden")){box.classList.add("hidden");d.textContent="عرض التفاصيل";return}box.classList.remove("hidden");d.textContent="إخفاء التفاصيل";if(box.dataset.loaded==="1")return;box.innerHTML='<div class="empty">جارٍ تحميل تفاصيل الحساب والإعلانات...</div>';try{const info=await invoke("details",id);const ads=info.listings||[];const active=ads.filter(x=>x.status==="active").length,sold=ads.filter(x=>x.status==="sold").length;box.innerHTML='<h3 style="margin:0 0 8px">تفاصيل الحساب</h3><div class="detailStats"><span class="detailPill">إجمالي الإعلانات: '+ads.length+'</span><span class="detailPill">متاحة: '+active+'</span><span class="detailPill">مباعة: '+sold+'</span><span class="detailPill">'+(info.banned_until&&new Date(info.banned_until)>new Date()?'الحساب محظور':'الحساب غير محظور')+'</span></div><h3 style="margin:12px 0 5px">إعلانات المستخدم</h3>'+(ads.length?ads.map(a=>{const img=Array.isArray(a.image_urls)?a.image_urls[0]:"";return '<div class="listingRow">'+(img?'<img src="'+esc(img)+'" alt="">':'<div style="width:66px;height:66px;border-radius:9px;background:#edf1ed"></div>')+'<div class="listingInfo"><div class="listingTitle">'+esc(a.title||"إعلان بدون عنوان")+'</div><div class="listingMeta">'+esc(a.category||"")+' · '+esc(a.city||"")+' · '+Number(a.price||0).toLocaleString("ar-MA")+' درهم<br>الحالة: '+esc(a.status||"غير محددة")+' · تاريخ النشر: '+(a.created_at?new Date(a.created_at).toLocaleDateString("ar-MA"):"—")+'</div></div></div>'}).join(""):'<div class="empty">لا توجد إعلانات لهذا المستخدم.</div>');box.dataset.loaded="1"}catch(err){box.innerHTML='<div class="empty">تعذر تحميل التفاصيل: '+esc(err.message)+'</div>'}return}
 const b=e.target.closest("[data-ban]"),u=e.target.closest("[data-unban]");if(!b&&!u)return;
 const id=b?b.dataset.ban:u.dataset.unban,target=users.find(x=>x.id===id);if(!target)return;
 const banning=!!b,msg=banning?"هل تريد حظر هذا الحساب؟ لن يتمكن صاحبه من تسجيل الدخول حتى تفك الحظر.":"هل تريد فك الحظر والسماح لهذا المستخدم بتسجيل الدخول؟";
 if(!confirm(msg))return;(b||u).disabled=true;
 try{await invoke(banning?"ban":"unban",id);alert(banning?"تم حظر الحساب.":"تم فك الحظر.");await load()}
 catch(err){alert("تعذر تنفيذ العملية: "+err.message);(b||u).disabled=false}
});
init();
</script><script src="notifications.js?v=1"></script><script src="analytics.js?v=2"></script></body></html>
