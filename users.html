<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://fvaffhfopoxgrofyilqx.supabase.co",KEY="sb_publishable_R5BievMMk58RUAgrz4Jz4g_SdBRIXEX";
const db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let users=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function invoke(action,user_id){const {data,error}=await db.functions.invoke("admin-users",{body:{action,user_id}});if(error)throw error;if(data?.error)throw new Error(data.error);return data}
const withTimeout=(promise,label,ms=12000)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error("انتهت مهلة الاتصال أثناء "+label+"؛ تحقق من الإنترنت ثم أعد المحاولة.")),ms))]);
async function init(){
 try{
  $("notice").textContent="جارٍ التحقق من تسجيل الدخول...";
  const auth=await withTimeout(db.auth.getUser(),"التحقق من تسجيل الدخول");
  const user=auth.data?.user;
  if(auth.error||!user){$("notice").textContent="لم نعثر على جلسة دخول. ارجع إلى سوقي وسجّل الدخول بحساب المدير ثم افتح الصفحة من جديد.";return}
  $("notice").textContent="تم التحقق من الدخول، جارٍ فحص صلاحيات المدير...";
  const result=await withTimeout(db.from("admins").select("user_id").eq("user_id",user.id).maybeSingle(),"فحص صلاحيات المدير");
  if(result.error)throw result.error;
  if(!result.data){$("notice").textContent="هذا الحساب لا يملك صلاحيات المدير. ادخل بالحساب الإداري الصحيح.";return}
  $("notice").textContent="تم التحقق بنجاح، جارٍ تحميل الحسابات...";
  $("panel").classList.remove("hidden");
  $("notice").classList.add("hidden");
  await load();
 }catch(e){
  $("notice").classList.remove("hidden");
  $("notice").textContent="تعذر فتح إدارة الحسابات: "+(e?.message||"خطأ غير معروف");
 }
}
window.addEventListener("unhandledrejection",e=>{$("notice").classList.remove("hidden");$("notice").textContent="حدث خطأ أثناء تحميل الصفحة: "+(e.reason?.message||e.reason||"غير معروف")});
window.addEventListener("error",e=>{$("notice").classList.remove("hidden");$("notice").textContent="خطأ في الصفحة: "+(e.message||"تعذر تشغيل JavaScript")});
