<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://fvaffhfopoxgrofyilqx.supabase.co","sb_publishable_R5BievMMk58RUAgrz4Jz4g_SdBRIXEX"),box=document.getElementById("list"),lang=localStorage.getItem("souki-language")||"ar";
const t={ar:{title:"📢 إعلانات سوقي الرسمية",market:"سوقي · SOUKI",messages:"← الرسائل",loading:"جارٍ تحميل الإعلانات...",sub:"آخر الأخبار والتنبيهات والتحديثات من إدارة سوقي",login:"يجب تسجيل الدخول لعرض الإعلانات الرسمية.",button:"تسجيل الدخول باستخدام Google",none:"لا توجد إعلانات رسمية حتى الآن.",err:"تعذر تحميل الإعلانات: "},fr:{title:"📢 Annonces officielles SOUKI",market:"SOUKI · Marketplace",messages:"← Messages",loading:"Chargement des annonces…",sub:"Actualités et annonces officielles de l’équipe SOUKI",login:"Connectez-vous pour voir les annonces officielles.",button:"Se connecter avec Google",none:"Aucune annonce officielle pour le moment.",err:"Impossible de charger les annonces : "},en:{title:"📢 Official SOUKI Announcements",market:"SOUKI · Marketplace",messages:"← Messages",loading:"Loading announcements…",sub:"News, notices and updates from the SOUKI team",login:"Please sign in to view official announcements.",button:"Sign in with Google",none:"No official announcements yet.",err:"Could not load announcements: "}}[lang]||{};
document.getElementById("pageTitle").textContent=t.title;
document.getElementById("marketLink").textContent=t.market;
document.getElementById("messagesLink").textContent=t.messages;
document.getElementById("subtitle").textContent=t.sub||"";
box.textContent=t.loading||"Loading…";
document.title=(lang==="ar"?"إعلانات سوقي الرسمية":lang==="fr"?"Annonces officielles SOUKI":"Official SOUKI Announcements")+" | SOUKI";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function toggleAnnouncementLike(button,userId){
 const announcementId=button.dataset.likeId,wasLiked=button.getAttribute("aria-pressed")==="true";
 button.disabled=true;
 try{
  if(wasLiked){
   const {error}=await db.from("announcement_likes").delete().eq("announcement_id",announcementId).eq("user_id",userId);
   if(error)throw error;
  }else{
   const {error}=await db.from("announcement_likes").insert({announcement_id:announcementId,user_id:userId});
   if(error)throw error;
  }
  const countEl=button.querySelector(".like-count"),heart=button.querySelector(".heart");
  const count=Math.max(0,(Number(countEl.textContent)||0)+(wasLiked?-1:1));
  countEl.textContent=String(count);button.classList.toggle("liked",!wasLiked);button.setAttribute("aria-pressed",String(!wasLiked));heart.textContent=wasLiked?"♡":"♥";
 }catch(error){console.warn("Announcement like:",error);alert(lang==="ar"?"تعذر تسجيل الإعجاب. حاول مرة أخرى.":lang==="fr"?"Impossible d’enregistrer le j’aime. Réessayez.":"Could not save your like. Please try again.");}
 finally{button.disabled=false}
}
async function init(){
 const {data:{user}}=await db.auth.getUser();
 if(!user){box.className="empty";box.innerHTML=esc(t.login||"يجب تسجيل الدخول")+"<br><br><button class='login' id='login'>"+esc(t.button||"تسجيل الدخول")+"</button>";document.getElementById("login").onclick=async()=>{if(window.soukiNativeGoogleLogin){await window.soukiNativeGoogleLogin(db);return}const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.href}});if(error)alert(error.message)};return}
 const [{data:rows,error},{data:reads, error:readError},{data:likes,error:likesError}]=await Promise.all([db.from("announcements").select("id,title,body,is_pinned,created_at").order("is_pinned",{ascending:false}).order("created_at",{ascending:false}),db.from("announcement_reads").select("announcement_id").eq("user_id",user.id),db.from("announcement_likes").select("announcement_id,user_id")]);
 if(error||readError||likesError){box.textContent=(t.err||"تعذر تحميل الإعلانات: ")+(error||readError||likesError).message;return}
 const seen=new Set((reads||[]).map(x=>x.announcement_id));
 const requestedId=new URLSearchParams(location.search).get("id");
 if(!rows?.length){box.className="empty";box.textContent=t.none||"لا توجد إعلانات رسمية حتى الآن.";return}
 box.className="list";
 const likeRows=likes||[],likeCounts=new Map(),myLikes=new Set();
 likeRows.forEach(x=>{likeCounts.set(x.announcement_id,(likeCounts.get(x.announcement_id)||0)+1);if(x.user_id===user.id)myLikes.add(x.announcement_id)});
 box.innerHTML=rows.map(n=>'<article class="announcement '+(seen.has(n.id)?"":"unread")+'" data-id="'+esc(n.id)+'"><h2>'+(n.is_pinned?"📌 ":"📢 ")+esc(n.title)+'</h2><p>'+esc(n.body)+'</p><div class="announcement-actions"><button type="button" class="announcement-like '+(myLikes.has(n.id)?"liked":"")+'" data-like-id="'+esc(n.id)+'" aria-pressed="'+myLikes.has(n.id)+'" aria-label="'+(lang==="ar"?"إعجاب":lang==="fr"?"J’aime":"Like")+'"><span class="heart">'+(myLikes.has(n.id)?"♥":"♡")+'</span><span class="like-count">'+(likeCounts.get(n.id)||0)+'</span></button><span class="announcement-date">'+new Date(n.created_at).toLocaleString(lang==="ar"?"ar-MA":lang==="fr"?"fr-FR":"en-GB",{dateStyle:"medium",timeStyle:"short"})+'</span></div></article>').join("");
 box.querySelectorAll("[data-like-id]").forEach(button=>button.addEventListener("click",()=>toggleAnnouncementLike(button,user.id)));
 if(requestedId){
  const target=box.querySelector('[data-id="'+CSS.escape(requestedId)+'"]');
  if(target){target.classList.add("notification-target");requestAnimationFrame(()=>target.scrollIntoView({behavior:"smooth",block:"center"}));}
 }
 const unreadToMark=requestedId?rows.filter(n=>n.id===requestedId&&!seen.has(n.id)):rows.filter(n=>!seen.has(n.id));
 for(const n of unreadToMark){const {error:markError}=await db.from("announcement_reads").upsert({announcement_id:n.id,user_id:user.id},{onConflict:"announcement_id,user_id",ignoreDuplicates:true});if(markError)console.warn("Announcement read receipt:",markError.message)}
 unreadToMark.forEach(n=>{const el=box.querySelector('[data-id="'+CSS.escape(n.id)+'"]');el?.classList.remove("unread")});
}
init().catch(e=>{box.textContent=(t.err||"حدث خطأ: ")+e.message});
db.channel("souki-official-announcements").on("postgres_changes",{event:"INSERT",schema:"public",table:"announcements"},()=>init()).subscribe();
</script><script src="notifications.js?v=1"></script><script src="language.js?v=4"></script><script type="module" src="native-auth.js?v=1"></script><script src="pull-to-refresh.js?v=1"></script></body></html>
