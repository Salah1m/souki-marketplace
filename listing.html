<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087443">
<title>تفاصيل الإعلان | SOUKI</title>
<style>
:root{--green:#087443;--green2:#0b9257;--ink:#18251e;--muted:#6b776f;--bg:#f5f7f5;--line:#e5ebe6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{width:min(1080px,calc(100% - 28px));margin:auto}
header{background:#fff;border-bottom:1px solid var(--line)}
.nav{height:66px;display:flex;align-items:center;justify-content:space-between}
.brand{color:var(--green);font-size:23px;font-weight:900;text-decoration:none}
.back{color:var(--green);font-weight:800;text-decoration:none}
main{padding:24px 0 42px}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.main-image{width:100%;height:430px;object-fit:contain;background:#f0f3f0;border-radius:12px}
.thumbs{display:flex;gap:9px;overflow:auto;margin-top:11px}
.thumb{flex:0 0 76px;height:70px;padding:2px;border:2px solid transparent;border-radius:9px;background:#f0f3f0}
.thumb.active{border-color:var(--green)}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px}
h1{font-size:25px;line-height:1.5;margin:0 0 12px}
.price{font-size:30px;font-weight:900;color:var(--green);margin:12px 0 18px}
.meta{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:16px}
.description{white-space:pre-wrap;line-height:1.9;color:#435047;margin:18px 0}
.seller{display:flex;align-items:center;gap:12px;margin-top:16px}
.seller-icon{width:48px;height:48px;border-radius:50%;background:#eaf3ed;color:var(--green);display:grid;place-items:center;font-size:24px}
.seller-rating{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:13px;color:#68756d}.seller-rating .stars,.review-stars{color:#e6a400;letter-spacing:1px;font-size:15px}.seller-rating strong{color:#263b30}.sale-note{padding:10px;background:#eef7f0;border-radius:10px;color:#176b46;font-size:14px}.sale-actions{display:flex;gap:8px;margin-top:10px}.sale-actions button{flex:1}.seller-reviews select,.seller-reviews textarea{width:100%;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.seller-reviews textarea{min-height:90px}.seller-reviews{margin-top:14px}.seller-reviews h3{font-size:16px;margin:0 0 10px}.review-item{padding:11px 0;border-top:1px solid var(--line);font-size:13px}.review-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}.review-item p{margin:0;color:#58665e;line-height:1.7;white-space:pre-wrap}
.whatsapp{display:block;text-align:center;background:#128c50;color:white;text-decoration:none;border-radius:11px;padding:14px;font-weight:800;margin-top:18px}.delete-ad{display:block;width:100%;border:1px solid #f0caca;background:#fff5f5;color:#b42318;border-radius:11px;padding:13px;font:inherit;font-weight:800;margin-top:12px;cursor:pointer}.delete-ad:disabled{opacity:.6;cursor:wait}
.edit-ad{display:block;width:100%;border:0;background:var(--green);color:#fff;border-radius:11px;padding:13px;font:inherit;font-weight:800;margin-top:12px;cursor:pointer}
.edit-form{display:none;margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:13px;background:#f9fbf9}
.edit-form.open{display:grid;gap:12px}
.edit-field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.edit-field input,.edit-field textarea,.edit-field select{width:100%;border:1px solid #dce5de;border-radius:9px;padding:11px;background:#fff;font:inherit;color:var(--ink)}
.edit-field textarea{min-height:110px;resize:vertical}
.edit-actions{display:flex;gap:9px}
.edit-save,.edit-cancel{flex:1;border:0;border-radius:9px;padding:12px;font:inherit;font-weight:800;cursor:pointer}
.edit-save{background:var(--green);color:#fff}.edit-cancel{background:#e9eeea;color:var(--ink)}
.edit-save:disabled{opacity:.6;cursor:wait}
.state{background:#fff;border:1px solid var(--line);border-radius:14px;padding:25px;text-align:center;color:var(--muted)}
@media(max-width:700px){.grid{grid-template-columns:1fr}.main-image{height:290px}h1{font-size:21px}.price{font-size:26px}}

body.souki-dark{--ink:#edf4ef;--muted:#aab8af;--bg:#101a14;--line:#2b3b30;background:#101a14;color:#edf4ef}body.souki-dark header,body.souki-dark .panel,body.souki-dark .state,body.souki-dark .edit-form{background:#19271e!important;color:#edf4ef!important;border-color:#34483a!important}body.souki-dark .description,body.souki-dark .meta{color:#c0cec4}</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="./">سوقي · SOUKI</a><a class="back" href="./#latest">← العودة إلى الإعلانات</a></div></header>
<main class="wrap"><div id="content" class="state">جارٍ تحميل الإعلان...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fvaffhfopoxgrofyilqx.supabase.co";
const SUPABASE_KEY="sb_publishable_R5BievMMk58RUAgrz4Jz4g_SdBRIXEX";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.getElementById("content");
const id=new URLSearchParams(location.search).get("id");
let preferredCurrency="MAD",exchangeRates={MAD:1};
function formatListingPrice(value){const rate=exchangeRates[preferredCurrency];if(!rate)return Number(value||0).toLocaleString("ar-MA")+" MAD";return new Intl.NumberFormat("ar-MA",{style:"currency",currency:preferredCurrency,maximumFractionDigits:2}).format(Number(value||0)*rate)}
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function load(){
 if(!id){root.textContent="رابط الإعلان غير صحيح.";return;}
 const {data:{user}}=await db.auth.getUser();
 if(user){const {data:p}=await db.from("user_preferences").select("currency,theme").eq("user_id",user.id).maybeSingle();if(p){preferredCurrency=p.currency||"MAD";if(p.theme==="dark")document.body.classList.add("souki-dark")}try{const rates=await fetch("https://api.frankfurter.app/latest?from=MAD&to=EUR,USD");if(rates.ok){const j=await rates.json();exchangeRates={MAD:1,...(j.rates||{})}}}catch(e){console.warn("Exchange rates unavailable",e)}}else if(localStorage.getItem("souki-theme")==="dark")document.body.classList.add("souki-dark");
 const {data,error}=await db.from("listings").select("id,seller_id,title,description,price,product_condition,category,city,image_urls,whatsapp,created_at,status,sales_count").eq("id",id).maybeSingle();
 const {data:sellerProfile}=await db.from("profiles").select("display_name,avatar_url").eq("id",data?.seller_id||"").maybeSingle();
 const reviewMarkup="";
 if(error||!data||(data.status!=="active"&&user?.id!==data.seller_id)){root.textContent="تعذر العثور على الإعلان. ربما تم حذفه أو إيقافه.";return;}
 const images=Array.isArray(data.image_urls)&&data.image_urls.length?data.image_urls:["https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=900"];
 const date=data.created_at?new Date(data.created_at).toLocaleDateString("ar-MA"):"";
 const wa=data.whatsapp?'<a class="whatsapp" id="whatsappContact" target="_blank" rel="noopener" href="https://wa.me/'+encodeURIComponent(data.whatsapp)+'">تواصل مع البائع عبر WhatsApp</a>':"";
 const canDelete=!!user&&user.id===data.seller_id;
 const editButton=canDelete?'<button class="edit-ad" id="editAd" type="button">✏️ تعديل الإعلان</button>':"";
 const deleteButton=canDelete?'<button class="delete-ad" id="deleteAd" type="button">🗑️ حذف الإعلان</button>':"";
 const availabilityButton=canDelete?'<button class="edit-ad" id="availabilityToggle" type="button">'+(data.status==="hidden"?"✅ إعادة إتاحة المنتج":"⛔ جعل المنتج غير متوفر")+'</button>':"";
 const {data:saleRows}=await db.from("listing_sales").select("id,buyer_id,seller_id,status,created_at").eq("listing_id",id).order("created_at",{ascending:false});
 const myPending=(saleRows||[]).filter(s=>s.status==="pending"&&s.seller_id===user?.id);
 const myConfirmed=(saleRows||[]).some(s=>s.buyer_id===user?.id&&s.status==="confirmed");

 const buyerSaleButton=user&&user.id!==data.seller_id&&data.status==="active"?(myPending?'<p class="sale-note">طلب الشراء أُرسل عبر WhatsApp وينتظر تأكيد البائع.</p>':(myConfirmed?'<p class="sale-note">تم تأكيد عملية بيع سابقة. يمكنك التواصل مجدداً عند شراء آخر.</p>':'<p class="sale-note">اضغط على زر WhatsApp للتواصل وإرسال طلب تأكيد الشراء.</p>')):"";
 const sellerPendingHtml=myPending.length?'<div class="seller-reviews"><h3>طلبات الشراء ('+myPending.length+')</h3>'+myPending.map(s=>'<div class="review-item"><strong>طلب شراء جديد</strong><div class="sale-actions"><button class="edit-save" data-sale-confirm="'+s.id+'" type="button">تأكيد البيع</button><button class="delete-ad" data-sale-reject="'+s.id+'" type="button">رفض الطلب</button></div></div>').join("")+'</div>':"";

 root.className="";
 root.innerHTML='<div class="grid"><section class="panel"><img class="main-image" id="mainImage" src="'+esc(images[0])+'" alt="'+esc(data.title)+'">'+(images.length>1?'<div class="thumbs">'+images.map((src,i)=>'<button class="thumb '+(i===0?"active":"")+'" type="button" data-index="'+i+'"><img src="'+esc(src)+'" alt="صورة '+(i+1)+'"></button>').join("")+'</div>':"")+'</section><section><div class="panel"><h1>'+esc(data.title)+'</h1><div class="price">'+Number(data.price).toLocaleString("ar-MA")+' درهم</div><div class="meta"><span>📍 '+esc(data.city)+'</span><span>🏷️ '+esc(data.category)+'</span>'+(data.product_condition?'<span>'+(data.product_condition==="new"?"✨ جديد":"♻️ مستعمل")+'</span>':"")+(date?'<span>🗓️ '+date+'</span>':"")+'</div><h3>وصف الإعلان</h3><p class="description">'+(data.description?esc(data.description):"لم يضف البائع وصفاً لهذا الإعلان بعد.")+'</p>'+wa+buyerSaleButton+availabilityButton+editButton+deleteButton+'<form class="edit-form" id="editForm"><div class="edit-field"><label for="editTitle">اسم الإعلان</label><input id="editTitle" maxlength="100" required></div><div class="edit-field"><label for="editPrice">السعر بالدرهم</label><input id="editPrice" type="number" min="0" step="0.01" required></div><div class="edit-field"><label for="editDescription">وصف الإعلان</label><textarea id="editDescription" maxlength="5000"></textarea></div><div class="edit-field"><label for="editCategory">الفئة</label><select id="editCategory" required></select></div><div class="edit-field"><label for="editCity">المدينة</label><select id="editCity" required></select></div><div class="edit-field"><label for="editWhatsapp">رقم WhatsApp</label><input id="editWhatsapp" type="tel" placeholder="2126XXXXXXXX"></div><div class="edit-actions"><button class="edit-save" id="saveEdit" type="submit">حفظ التعديلات</button><button class="edit-cancel" id="cancelEdit" type="button">إلغاء</button></div></form></div><div class="panel"><div class="seller"><img class="seller-icon" style="object-fit:cover" src="'+esc(sellerProfile?.avatar_url||"https://www.gravatar.com/avatar/?d=mp")+'" alt="صورة البائع"><div><strong>'+esc(sellerProfile?.display_name||"بائع على سوقي")+'</strong><div style="color:#6b776f;font-size:13px;margin-top:4px">📍 '+esc(data.city)+'</div><div class="seller-rating">🛒 عدد المبيعات: <strong>'+Number(data.sales_count||0)+'</strong></div></div></div>'+reviewMarkup+sellerPendingHtml+'<div class="seller-rating">🛒 عدد المبيعات: <strong>'+Number(data.sales_count||0)+'</strong></div></div></section></div>';
 root.querySelectorAll("[data-index]").forEach(button=>button.addEventListener("click",()=>{const n=Number(button.dataset.index);document.getElementById("mainImage").src=images[n];root.querySelectorAll(".thumb").forEach(el=>el.classList.toggle("active",el===button));}));

 const availabilityBtn=document.getElementById("availabilityToggle");
 if(availabilityBtn)availabilityBtn.addEventListener("click",async()=>{const nextStatus=data.status==="hidden"?"active":"hidden";if(!confirm(nextStatus==="hidden"?"هل تريد جعل هذا المنتج غير متوفر وإخفاءه من الإعلانات؟":"هل تريد إعادة إتاحة المنتج للناس؟"))return;availabilityBtn.disabled=true;const {error:statusError}=await db.from("listings").update({status:nextStatus}).eq("id",data.id).eq("seller_id",user.id);if(statusError){alert("تعذر تحديث حالة المنتج: "+statusError.message);availabilityBtn.disabled=false;return;}alert(nextStatus==="hidden"?"أصبح المنتج غير متوفر ولن يظهر في الإعلانات.":"تمت إعادة إتاحة المنتج.");await load();});

 const whatsappContact=document.getElementById("whatsappContact");
 if(whatsappContact)whatsappContact.addEventListener("click",async event=>{
  if(!user||user.id===data.seller_id||data.status!=="active")return;
  event.preventDefault();
  whatsappContact.style.pointerEvents="none";
  const pending=(saleRows||[]).some(s=>s.buyer_id===user.id&&s.status==="pending");
  if(!pending){
   const {error:requestError}=await db.from("listing_sales").insert({listing_id:data.id,buyer_id:user.id,seller_id:data.seller_id});
   if(requestError&&requestError.code!=="23505"){alert("تعذر إرسال طلب الشراء: "+requestError.message);whatsappContact.style.pointerEvents="";return;}
  }
  const buyerName=user.user_metadata?.full_name||user.user_metadata?.name||user.email||"مشتري على سوقي";
  const message="مرحباً، أنا "+buyerName+" وأرغب في شراء المنتج: "+data.title+". أرسلت طلب تأكيد الشراء عبر منصة سوقي. بعد إتمام البيع، يرجى تأكيد العملية من صفحة الإعلان في سوقي. رابط الإعلان: "+window.location.href;
  window.location.href="https://wa.me/"+encodeURIComponent(data.whatsapp)+"?text="+encodeURIComponent(message);
 });
 const requestSaleBtn=document.getElementById("requestSale");
 if(requestSaleBtn)requestSaleBtn.addEventListener("click",async()=>{if(!user){alert("يرجى تسجيل الدخول أولاً لطلب الشراء.");return;}requestSaleBtn.disabled=true;const {error:requestError}=await db.from("listing_sales").insert({listing_id:data.id,buyer_id:user.id,seller_id:data.seller_id});if(requestError){alert(requestError.code==="23505"?"لديك طلب شراء قيد الانتظار بالفعل.":"تعذر إرسال الطلب: "+requestError.message);requestSaleBtn.disabled=false;return;}alert("تم إرسال طلب الشراء إلى البائع.");await load();});
 root.querySelectorAll("[data-sale-confirm],[data-sale-reject]").forEach(button=>button.addEventListener("click",async()=>{const saleId=button.dataset.saleConfirm||button.dataset.saleReject;const next=button.dataset.saleConfirm?"confirmed":"rejected";if(!confirm(next==="confirmed"?"هل تؤكد إتمام عملية البيع؟":"هل تريد رفض طلب الشراء؟"))return;button.disabled=true;const {error:saleError}=await db.from("listing_sales").update({status:next}).eq("id",saleId).eq("seller_id",user.id);if(saleError){alert("تعذر تحديث الطلب: "+saleError.message);button.disabled=false;return;}alert(next==="confirmed"?"تم تأكيد البيع واحتساب عملية بيع جديدة.":"تم رفض الطلب.");await load();}));

 const editBtn=document.getElementById("editAd");
 const editForm=document.getElementById("editForm");
 if(editBtn&&editForm){
  const categories=["سيارات","عقارات","هواتف وإلكترونيات","حواسيب وألعاب","ملابس وأحذية","أثاث ومنزل","أجهزة منزلية","حيوانات","وظائف وخدمات","معدات وأدوات","أخرى"];
  const cities=["الدار البيضاء","الرباط","مراكش","فاس","طنجة","أكادير","مكناس","وجدة","القنيطرة","تطوان","آسفي","الجديدة","الناظور","بني ملال","خريبكة","العيون","الداخلة","ورزازات","الصويرة","سطات"];
  const fill=(element,values,current)=>{element.innerHTML=values.map(value=>'<option value="'+esc(value)+'"'+(value===current?' selected':'')+'>'+esc(value)+'</option>').join("");};
  document.getElementById("editTitle").value=data.title||"";
  document.getElementById("editPrice").value=data.price??"";
  document.getElementById("editDescription").value=data.description||"";
  document.getElementById("editWhatsapp").value=data.whatsapp||"";
  fill(document.getElementById("editCategory"),categories,data.category);
  fill(document.getElementById("editCity"),cities,data.city);
  editBtn.addEventListener("click",()=>{editForm.classList.toggle("open");if(editForm.classList.contains("open"))editForm.scrollIntoView({behavior:"smooth",block:"center"});});
  document.getElementById("cancelEdit").addEventListener("click",()=>editForm.classList.remove("open"));
  editForm.addEventListener("submit",async event=>{
   event.preventDefault();
   const saveBtn=document.getElementById("saveEdit");
   const {data:{user:currentUser}}=await db.auth.getUser();
   if(!currentUser||currentUser.id!==data.seller_id){alert("ليس لديك صلاحية تعديل هذا الإعلان.");return;}
   const updates={title:document.getElementById("editTitle").value.trim(),price:Number(document.getElementById("editPrice").value),description:document.getElementById("editDescription").value.trim(),category:document.getElementById("editCategory").value,city:document.getElementById("editCity").value,whatsapp:document.getElementById("editWhatsapp").value.replace(/\D/g,"")};
   if(!updates.title||!Number.isFinite(updates.price)||updates.price<0){alert("يرجى إدخال اسم وسعر صحيحين.");return;}
   saveBtn.disabled=true;saveBtn.textContent="جارٍ حفظ التعديلات...";
   const {error:updateError}=await db.from("listings").update(updates).eq("id",data.id).eq("seller_id",currentUser.id);
   if(updateError){alert("تعذر حفظ التعديلات: "+updateError.message);saveBtn.disabled=false;saveBtn.textContent="حفظ التعديلات";return;}
   alert("تم تحديث إعلانك بنجاح.");await load();
  });
 }
 const deleteBtn=document.getElementById("deleteAd");
 if(deleteBtn)deleteBtn.addEventListener("click",async()=>{
  if(!confirm("هل أنت متأكد أنك تريد حذف هذا الإعلان نهائياً؟ لا يمكن التراجع عن هذه العملية."))return;
  deleteBtn.disabled=true;deleteBtn.textContent="جارٍ حذف الإعلان...";
  const {data:{user:currentUser}}=await db.auth.getUser();
  if(!currentUser||currentUser.id!==data.seller_id){alert("ليس لديك صلاحية حذف هذا الإعلان.");deleteBtn.disabled=false;deleteBtn.textContent="🗑️ حذف الإعلان";return;}
  const {error:deleteError}=await db.from("listings").delete().eq("id",data.id).eq("seller_id",currentUser.id);
  if(deleteError){alert("تعذر حذف الإعلان: "+deleteError.message);deleteBtn.disabled=false;deleteBtn.textContent="🗑️ حذف الإعلان";return;}
  alert("تم حذف إعلانك بنجاح.");location.href="./#latest";
 });
}
load();
</script>
</body>
</html>
