<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087443">
<title>تفاصيل الإعلان | SOUKI</title>
<style>
:root{--green:#087443;--green2:#0b9257;--ink:#18251e;--muted:#6b776f;--bg:#f5f7f5;--line:#e5ebe6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{width:min(1080px,calc(100% - 28px));margin:auto}
header{background:#fff;border-bottom:1px solid var(--line)}
.nav{height:66px;display:flex;align-items:center;justify-content:space-between}
.brand{color:var(--green);font-size:23px;font-weight:900;text-decoration:none}
.back{color:var(--green);font-weight:800;text-decoration:none}
main{padding:24px 0 42px}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.main-image{width:100%;height:430px;object-fit:contain;background:#f0f3f0;border-radius:12px}
.thumbs{display:flex;gap:9px;overflow:auto;margin-top:11px}
.thumb{flex:0 0 76px;height:70px;padding:2px;border:2px solid transparent;border-radius:9px;background:#f0f3f0}
.thumb.active{border-color:var(--green)}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px}
h1{font-size:25px;line-height:1.5;margin:0 0 12px}
.price{font-size:30px;font-weight:900;color:var(--green);margin:12px 0 18px}
.meta{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:16px}
.description{white-space:pre-wrap;line-height:1.9;color:#435047;margin:18px 0}
.seller{display:flex;align-items:center;gap:12px;margin-top:16px}
.seller-icon{width:48px;height:48px;border-radius:50%;background:#eaf3ed;color:var(--green);display:grid;place-items:center;font-size:24px}
.whatsapp{display:block;text-align:center;background:#128c50;color:white;text-decoration:none;border-radius:11px;padding:14px;font-weight:800;margin-top:18px}.delete-ad{display:block;width:100%;border:1px solid #f0caca;background:#fff5f5;color:#b42318;border-radius:11px;padding:13px;font:inherit;font-weight:800;margin-top:12px;cursor:pointer}.delete-ad:disabled{opacity:.6;cursor:wait}
.edit-ad{display:block;width:100%;border:0;background:var(--green);color:#fff;border-radius:11px;padding:13px;font:inherit;font-weight:800;margin-top:12px;cursor:pointer}
.edit-form{display:none;margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:13px;background:#f9fbf9}
.edit-form.open{display:grid;gap:12px}
.edit-field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.edit-field input,.edit-field textarea,.edit-field select{width:100%;border:1px solid #dce5de;border-radius:9px;padding:11px;background:#fff;font:inherit;color:var(--ink)}
.edit-field textarea{min-height:110px;resize:vertical}
.edit-actions{display:flex;gap:9px}
.edit-save,.edit-cancel{flex:1;border:0;border-radius:9px;padding:12px;font:inherit;font-weight:800;cursor:pointer}
.edit-save{background:var(--green);color:#fff}.edit-cancel{background:#e9eeea;color:var(--ink)}
.edit-save:disabled{opacity:.6;cursor:wait}
.state{background:#fff;border:1px solid var(--line);border-radius:14px;padding:25px;text-align:center;color:var(--muted)}
@media(max-width:700px){.grid{grid-template-columns:1fr}.main-image{height:290px}h1{font-size:21px}.price{font-size:26px}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="./">سوقي · SOUKI</a><a class="back" href="./#latest">← العودة إلى الإعلانات</a></div></header>
<main class="wrap"><div id="content" class="state">جارٍ تحميل الإعلان...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fvaffhfopoxgrofyilqx.supabase.co";
const SUPABASE_KEY="sb_publishable_R5BievMMk58RUAgrz4Jz4g_SdBRIXEX";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.getElementById("content");
const id=new URLSearchParams(location.search).get("id");
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function load(){
 if(!id){root.textContent="رابط الإعلان غير صحيح.";return;}
 const {data,error}=await db.from("listings").select("id,seller_id,title,description,price,category,city,image_urls,whatsapp,created_at,status").eq("id",id).eq("status","active").maybeSingle();
 if(error||!data){root.textContent="تعذر العثور على الإعلان. ربما تم حذفه أو إيقافه.";return;}
 const images=Array.isArray(data.image_urls)&&data.image_urls.length?data.image_urls:["https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=900"];
 const date=data.created_at?new Date(data.created_at).toLocaleDateString("ar-MA"):"";
 const wa=data.whatsapp?'<a class="whatsapp" target="_blank" rel="noopener" href="https://wa.me/'+encodeURIComponent(data.whatsapp)+'">تواصل مع البائع عبر WhatsApp</a>':"";
 const {data:{user}}=await db.auth.getUser();
 const canDelete=!!user&&user.id===data.seller_id;
 const editButton=canDelete?'<button class="edit-ad" id="editAd" type="button">✏️ تعديل الإعلان</button>':"";
 const deleteButton=canDelete?'<button class="delete-ad" id="deleteAd" type="button">🗑️ حذف الإعلان</button>':"";
 root.className="";
 root.innerHTML='<div class="grid"><section class="panel"><img class="main-image" id="mainImage" src="'+esc(images[0])+'" alt="'+esc(data.title)+'">'+(images.length>1?'<div class="thumbs">'+images.map((src,i)=>'<button class="thumb '+(i===0?"active":"")+'" type="button" data-index="'+i+'"><img src="'+esc(src)+'" alt="صورة '+(i+1)+'"></button>').join("")+'</div>':"")+'</section><section><div class="panel"><h1>'+esc(data.title)+'</h1><div class="price">'+Number(data.price).toLocaleString("ar-MA")+' درهم</div><div class="meta"><span>📍 '+esc(data.city)+'</span><span>🏷️ '+esc(data.category)+'</span>'+(date?'<span>🗓️ '+date+'</span>':"")+'</div><h3>وصف الإعلان</h3><p class="description">'+(data.description?esc(data.description):"لم يضف البائع وصفاً لهذا الإعلان بعد.")+'</p>'+wa+editButton+deleteButton+'<form class="edit-form" id="editForm"><div class="edit-field"><label for="editTitle">اسم الإعلان</label><input id="editTitle" maxlength="100" required></div><div class="edit-field"><label for="editPrice">السعر بالدرهم</label><input id="editPrice" type="number" min="0" step="0.01" required></div><div class="edit-field"><label for="editDescription">وصف الإعلان</label><textarea id="editDescription" maxlength="5000"></textarea></div><div class="edit-field"><label for="editCategory">الفئة</label><select id="editCategory" required></select></div><div class="edit-field"><label for="editCity">المدينة</label><select id="editCity" required></select></div><div class="edit-field"><label for="editWhatsapp">رقم WhatsApp</label><input id="editWhatsapp" type="tel" placeholder="2126XXXXXXXX"></div><div class="edit-actions"><button class="edit-save" id="saveEdit" type="submit">حفظ التعديلات</button><button class="edit-cancel" id="cancelEdit" type="button">إلغاء</button></div></form></div><div class="panel seller"><div class="seller-icon">♙</div><div><strong>البائع على سوقي</strong><div style="color:#6b776f;font-size:13px;margin-top:4px">📍 '+esc(data.city)+'</div></div></div></section></div>';
 root.querySelectorAll("[data-index]").forEach(button=>button.addEventListener("click",()=>{const n=Number(button.dataset.index);document.getElementById("mainImage").src=images[n];root.querySelectorAll(".thumb").forEach(el=>el.classList.toggle("active",el===button));}));
 const editBtn=document.getElementById("editAd");
 const editForm=document.getElementById("editForm");
 if(editBtn&&editForm){
  const categories=["سيارات","عقارات","هواتف وإلكترونيات","حواسيب وألعاب","ملابس وأحذية","أثاث ومنزل","أجهزة منزلية","حيوانات","وظائف وخدمات","معدات وأدوات","أخرى"];
  const cities=["الدار البيضاء","الرباط","مراكش","فاس","طنجة","أكادير","مكناس","وجدة","القنيطرة","تطوان","آسفي","الجديدة","الناظور","بني ملال","خريبكة","العيون","الداخلة","ورزازات","الصويرة","سطات"];
  const fill=(element,values,current)=>{element.innerHTML=values.map(value=>'<option value="'+esc(value)+'"'+(value===current?' selected':'')+'>'+esc(value)+'</option>').join("");};
  document.getElementById("editTitle").value=data.title||"";
  document.getElementById("editPrice").value=data.price??"";
  document.getElementById("editDescription").value=data.description||"";
  document.getElementById("editWhatsapp").value=data.whatsapp||"";
  fill(document.getElementById("editCategory"),categories,data.category);
  fill(document.getElementById("editCity"),cities,data.city);
  editBtn.addEventListener("click",()=>{editForm.classList.toggle("open");if(editForm.classList.contains("open"))editForm.scrollIntoView({behavior:"smooth",block:"center"});});
  document.getElementById("cancelEdit").addEventListener("click",()=>editForm.classList.remove("open"));
  editForm.addEventListener("submit",async event=>{
   event.preventDefault();
   const saveBtn=document.getElementById("saveEdit");
   const {data:{user:currentUser}}=await db.auth.getUser();
   if(!currentUser||currentUser.id!==data.seller_id){alert("ليس لديك صلاحية تعديل هذا الإعلان.");return;}
   const updates={title:document.getElementById("editTitle").value.trim(),price:Number(document.getElementById("editPrice").value),description:document.getElementById("editDescription").value.trim(),category:document.getElementById("editCategory").value,city:document.getElementById("editCity").value,whatsapp:document.getElementById("editWhatsapp").value.replace(/\\D/g,"")};
   if(!updates.title||!Number.isFinite(updates.price)||updates.price<0){alert("يرجى إدخال اسم وسعر صحيحين.");return;}
   saveBtn.disabled=true;saveBtn.textContent="جارٍ حفظ التعديلات...";
   const {error:updateError}=await db.from("listings").update(updates).eq("id",data.id).eq("seller_id",currentUser.id);
   if(updateError){alert("تعذر حفظ التعديلات: "+updateError.message);saveBtn.disabled=false;saveBtn.textContent="حفظ التعديلات";return;}
   alert("تم تحديث إعلانك بنجاح.");await load();
  });
 }
 const deleteBtn=document.getElementById("deleteAd");
 if(deleteBtn)deleteBtn.addEventListener("click",async()=>{
  if(!confirm("هل أنت متأكد أنك تريد حذف هذا الإعلان نهائياً؟ لا يمكن التراجع عن هذه العملية."))return;
  deleteBtn.disabled=true;deleteBtn.textContent="جارٍ حذف الإعلان...";
  const {data:{user:currentUser}}=await db.auth.getUser();
  if(!currentUser||currentUser.id!==data.seller_id){alert("ليس لديك صلاحية حذف هذا الإعلان.");deleteBtn.disabled=false;deleteBtn.textContent="🗑️ حذف الإعلان";return;}
  const {error:deleteError}=await db.from("listings").delete().eq("id",data.id).eq("seller_id",currentUser.id);
  if(deleteError){alert("تعذر حذف الإعلان: "+deleteError.message);deleteBtn.disabled=false;deleteBtn.textContent="🗑️ حذف الإعلان";return;}
  alert("تم حذف إعلانك بنجاح.");location.href="./#latest";
 });
}
load();
</script>
</body>
</html>
